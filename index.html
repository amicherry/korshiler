<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Көршілер — E-KNOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one letterboxed pixel canvas; touch pads float over the bottom corners. Single deliberate dark frame. */
:root{
  --frame:#15161c; --ink:#f4f3ee; --accent:#f2c94c;
  --pad:rgba(20,22,32,.38); --pad-on:rgba(242,201,76,.55); --line:rgba(244,243,238,.38);
  --font-pixel:"Press Start 2P", ui-monospace, monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--frame);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
#wrap{width:100%;height:100%;display:grid;place-items:center}
/* телефон: игра на весь экран, отступы только под вырез и закругления */
/* отступ под камеру берём одинаковым с обеих сторон — иначе игра съезжает от центра */
.touch body{--side:max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  padding:env(safe-area-inset-top,0px) var(--side) env(safe-area-inset-bottom,0px) var(--side)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0c10}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;justify-content:space-between;align-items:flex-end;
  padding:0 calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px))}
.touch #touch{display:flex}
.pad{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:8px}
/* крупные полупрозрачные кнопки поверх игры: не закрывают картинку и легко попадаются пальцем */
.btn{width:clamp(76px,23vh,104px);height:clamp(76px,23vh,104px);border-radius:50%;background:var(--pad);border:2px solid var(--line);display:grid;place-items:center;
  color:rgba(244,243,238,.9);padding:0;cursor:pointer;touch-action:none;font:10px var(--font-pixel);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);text-shadow:0 1px 0 #000}
.btn.small{width:clamp(66px,19vh,88px);height:clamp(66px,19vh,88px)}
.btn.act{width:clamp(88px,27vh,120px);height:clamp(88px,27vh,120px);font-size:11px;border-color:rgba(242,201,76,.6)}
.btn.on{background:var(--pad-on)}
.btn svg{width:38%;height:38%;fill:currentColor}
#fs{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:6;width:40px;height:40px;
  border-radius:8px;background:var(--pad);border:2px solid var(--line);color:var(--ink);display:none;place-items:center;padding:0}
.touch #fs.ok{display:grid}
#fs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.btn[hidden]{display:none!important}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#nameBox{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center}
#nameBox label{font:10px var(--font-pixel);color:#2b2a33}
#nameInput{font:14px var(--font-pixel);padding:8px 10px;width:min(320px,70vw);border:3px solid #1b1a21;background:#f4f3ee;color:#2b2a33;text-align:center}
#nameInput:focus-visible{outline:3px solid var(--accent)}
#rotate{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(43,42,51,.92);border:1px solid var(--accent);color:var(--ink);font:9px/1.6 var(--font-pixel);padding:8px 12px;text-align:center;max-width:calc(100% - 32px)}
@media (orientation:portrait){ .touch #rotate{display:block} }
#err{position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#b8443f;color:#fff;font:12px/1.4 ui-monospace,monospace;padding:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" aria-label="Игра «Көршілер»"></canvas></div>
<div id="nameBox" hidden><input id="nameInput" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Имя героя"></div>
<div id="rotate"></div>
<button id="fs" aria-label="На весь экран"><svg viewBox="0 0 20 20"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg></button>
<div id="err" hidden></div>
<div id="touch" aria-label="Экранное управление">
  <div class="pad">
    <button class="btn" data-k="left" aria-label="Влево"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    <button class="btn" data-k="right" aria-label="Вправо"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
  </div>
  <div class="pad">
    <div class="col">
      <button class="btn small" data-k="up" aria-label="Вверх"><svg viewBox="0 0 10 10"><path d="M1 7 5 2l4 5z"/></svg></button>
      <button class="btn small" data-k="down" aria-label="Вниз"><svg viewBox="0 0 10 10"><path d="M1 3l4 5 4-5z"/></svg></button>
    </div>
    <button class="btn act" data-k="act" aria-label="Действие"></button>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   ДВИЖОК: экран, ввод, текст, кнопки, переходы, звук, сохранения
   Логическое разрешение 400×225, холст рисуется в 3 раза крупнее,
   чтобы при растягивании под экран не терялись строки пикселей.
   ============================================================ */
const W = 400, H = 225, S = 3;
const FONT = '"Press Start 2P", monospace';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W * S; cv.height = H * S;
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if (isTouch) document.documentElement.classList.add('touch');

function fit() {
  const wrap = document.getElementById('wrap');
  // на телефоне — максимально крупно; кнопки полупрозрачные и лежат поверх игры
  const k = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  cv.style.width = Math.floor(W * k) + 'px';
  cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- ошибки — на экран, чтобы их было видно на скриншоте ---------- */
addEventListener('error', e => {
  const el = document.getElementById('err'); if (!el) return;
  el.hidden = false; el.textContent += (e.message || 'Error') + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 4).join('\n') : '') + '\n';
});
addEventListener('unhandledrejection', e => {
  const el = document.getElementById('err'); if (!el) return;
  el.hidden = false; el.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
});

/* ---------- хранилище ---------- */
function loadStr(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- случайные числа с зерном ---------- */
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (R, arr) => arr[Math.floor(R() * arr.length)];

/* ---------- ввод ---------- */
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down', KeyE: 'act', Space: 'act', Enter: 'act', Escape: 'back', KeyB: 'ballot', Tab: 'ballot', KeyR: 'raccoon' };
addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.id === 'nameInput') { if (e.code === 'Enter') { pressed.act = true; } return; }
  const k = KEYMAP[e.code]; if (!k) return;
  if (!keys[k]) pressed[k] = true; keys[k] = true; e.preventDefault(); audioUnlock();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
const hit = k => { const v = !!pressed[k]; pressed[k] = false; return v; };
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('on'); audioUnlock(); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
const touchBtn = k => document.querySelector(`[data-k="${k}"]`);
// какие экранные кнопки нужны сейчас: стрелки «влево/вправо» — только там, где герой ходит
function setTouch({ act = null, up = false, down = false, move = false } = {}) {
  const a = touchBtn('act'); if (a) { a.hidden = act === null; if (act !== null && a.textContent !== act) a.textContent = act; }
  const u = touchBtn('up'), d = touchBtn('down'); if (u) u.hidden = !up; if (d) d.hidden = !down;
  for (const k of ['left', 'right']) { const b = touchBtn(k); if (b) b.hidden = !move; }
}
// на весь экран + альбомная ориентация (Android; на iPhone — через «На экран Домой»)
{ const fs = document.getElementById('fs'), el = document.documentElement;
  if (fs && (el.requestFullscreen || el.webkitRequestFullscreen)) {
    fs.classList.add('ok');
    fs.addEventListener('click', async () => {
      try { if (document.fullscreenElement) await document.exitFullscreen(); else { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {}); } } catch (err) {}
      setTimeout(fit, 200);
    });
  } }

/* мышь и касания по холсту: щелчки собираются за кадр, кнопки проверяют их сами */
let clicks = [];
const pointer = { x: -1, y: -1 };
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => { audioUnlock(); const p = toLogical(e); clicks.push(p); });
cv.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; });
const TAP_PAD = isTouch ? 3 : 0;   // палец толще курсора: зона нажатия чуть больше кнопки
function clickIn(x, y, w, h) {
  const p = TAP_PAD, i = clicks.findIndex(c => c.x >= x - p && c.x < x + w + p && c.y >= y - p && c.y < y + h + p);
  if (i < 0) return false; clicks.splice(i, 1); return true;
}

/* ---------- текст ---------- */
function font(size = 8) { ctx.font = `${size}px ${FONT}`; }
function text(s, x, y, o = {}) {
  const { col = '#f4f3ee', size = 8, align = 'left', shadow = null } = o;
  font(size); ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, Math.round(x), Math.round(y) + 1); }
  ctx.fillStyle = col; ctx.fillText(s, Math.round(x), Math.round(y));
}
function textW(s, size = 8) { font(size); return ctx.measureText(s).width; }
function wrapText(s, maxW, size = 8) {
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (textW(t, size) > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}

/* ---------- примитивы ---------- */
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const P = { g, w, h,
    r: (x, y, ww, hh, col) => { if (!col) return; g.fillStyle = col; g.fillRect(x | 0, y | 0, ww | 0, hh | 0); },
    p: (x, y, col) => { if (!col) return; g.fillStyle = col; g.fillRect(x | 0, y | 0, 1, 1); },
    line: (x0, y0, x1, y1, col) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; g.fillStyle = col;
      for (let i = 0; i <= n; i++) g.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1); },
    ell: (cx, cy, rx, ry, col) => { g.fillStyle = col; for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
      if ((x * x) / (rx * rx + .5) + (y * y) / (ry * ry + .5) <= 1) g.fillRect(cx + x, cy + y, 1, 1); },
  };
  draw(P); return c;
}
function sprite(img, x, y, flip = false, alpha = 1) {
  ctx.imageSmoothingEnabled = false;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  if (flip) { ctx.save(); ctx.translate(Math.round(x) + img.width, Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); }
  else ctx.drawImage(img, Math.round(x), Math.round(y));
  if (alpha !== 1) ctx.globalAlpha = 1;
}

/* ---------- интерфейс: кнопки, бумага, табличка ---------- */
const BTN_COL = { primary: ['#f2c94c', '#b08a1e', '#2b2a33', '#fbe39a'], alt: ['#7fc4a8', '#3f8a6e', '#2b2a33', '#b9e6d3'],
  off: ['#5a5766', '#3a3846', '#c3c0cf', '#6c6978'], danger: ['#e98f6f', '#a8553c', '#2b2a33', '#f6c0ab'], dark: ['#3a3946', '#24232c', '#f4f3ee', '#4b4a57'] };
/* кнопка: рисуется и сразу проверяет щелчок; возвращает true, если нажата */
function button(label, cx, y, kind = 'primary', o = {}) {
  const C = BTN_COL[kind]; const w = Math.round((o.w || textW(label) + 12)), h = 16;
  let x = Math.round(o.left !== undefined ? o.left : clamp(cx - w / 2, 4, W - 4 - w));
  const hov = !isTouch && pointer.x >= x && pointer.x < x + w && pointer.y >= y && pointer.y < y + h;
  const sel = o.selected;
  rect(x + 1, y, w - 2, h, '#1b1a21'); rect(x, y + 1, w, h - 2, '#1b1a21');
  rect(x + 1, y + 1, w - 2, h - 2, C[1]); rect(x + 1, y + 1, w - 2, h - 5, (hov || sel) ? C[3] : C[0]); rect(x + 2, y + 1, w - 4, 1, C[3]);
  text(label, x + w / 2, y + 3, { col: C[2], align: 'center' });
  if (sel) { rect(x - 5, y + 5, 3, 5, '#f2c94c'); }
  return clickIn(x, y, w, h);
}
function paper(x, y, w, h, seed = 1) {
  const R = rng(w * 7 + h + seed);
  rect(x + 3, y + 3, w, h, 'rgba(10,10,14,.45)');
  rect(x, y, w, h, '#cfc3a5'); rect(x + 1, y + 1, w - 2, h - 2, '#efe8d6');
  ctx.fillStyle = '#e2d9c2'; for (let i = 0; i < w * h / 90; i++) ctx.fillRect(Math.round(x + 2 + R() * (w - 4)), Math.round(y + 2 + R() * (h - 4)), 1, 1);
  ctx.fillStyle = '#d4c8aa'; ctx.beginPath(); ctx.moveTo(x + w - 11, y + h - 1); ctx.lineTo(x + w - 1, y + h - 11); ctx.lineTo(x + w - 11, y + h - 11); ctx.fill();
  for (const tx of [x + 14, x + w - 42]) { rect(tx, y - 4, 28, 9, 'rgba(234,220,156,.85)'); rect(tx, y - 4, 1, 9, 'rgba(211,194,122,.9)'); rect(tx + 27, y - 4, 1, 9, 'rgba(211,194,122,.9)'); }
}
function plate(x, y, w, h) {
  rect(x + 3, y + 3, w, h, 'rgba(16,24,42,.5)');
  rect(x + 1, y, w - 2, h, '#e9eef5'); rect(x, y + 1, w, h - 2, '#e9eef5');
  rect(x + 3, y + 2, w - 6, h - 4, '#2f4f8a'); rect(x + 2, y + 3, w - 4, h - 6, '#2f4f8a');
  rect(x + 3, y + h - 6, w - 6, 3, '#284579');
  for (const [rx, ry] of [[x + 6, y + 6], [x + w - 8, y + 6], [x + 6, y + h - 8], [x + w - 8, y + h - 8]]) rect(rx, ry, 2, 2, '#9fb0cc');
}
// тёмная пиксельная рамка: панели меню, HUD, диалог
function frameBox(x, y, w, h, alpha = .9) {
  rect(x + 2, y + 2, w, h, 'rgba(5,6,10,.5)');
  rect(x, y, w, h, `rgba(14,17,28,${alpha})`);
  rect(x + 1, y, w - 2, 1, '#55607c'); rect(x + 1, y + h - 1, w - 2, 1, '#55607c'); rect(x, y + 1, 1, h - 2, '#55607c'); rect(x + w - 1, y + 1, 1, h - 2, '#55607c');
  rect(x + 2, y + 2, w - 4, 1, '#262c3d'); rect(x + 2, y + h - 3, w - 4, 1, '#0a0c12');
  for (const [cx, cy] of [[x + 2, y + 2], [x + w - 4, y + 2], [x + 2, y + h - 4], [x + w - 4, y + h - 4]]) rect(cx, cy, 2, 2, '#8792ad');
}
const INK = '#2b2a33', INK_RED = '#b8443f', INK_TEAL = '#2f8577', INK_MUTED = '#857d6c', INK_GOLD = '#a87b12';

/* ---------- уведомления E-KNOT (тосты) ---------- */
const toasts = [];
function toast(title, body, ms = 3800) { toasts.length = 0; toasts.push({ title, body, t: 0, ms }); beep(880, .05, 'sine', .03); beep(1320, .07, 'sine', .03, .06); }
function drawToasts(dt) {
  if (scene && scene.ballot) return;
  for (const T of toasts) {
    T.t += dt;
    const a = T.t < 150 ? T.t / 150 : T.t > T.ms - 300 ? Math.max(0, (T.ms - T.t) / 300) : 1;
    ctx.globalAlpha = a;
    const lines = wrapText(T.body, 290);
    const w = Math.max(textW(T.title) + 28, 150, ...lines.map(l => textW(l) + 16)) | 0, h = 18 + lines.length * 11 + 4;
    const x = Math.round((W - w) / 2), y = 22;
    rect(x + 2, y + 2, w, h, 'rgba(20,19,24,.35)');
    rect(x + 1, y, w - 2, h, '#1b1a21'); rect(x, y + 1, w, h - 2, '#1b1a21');
    rect(x + 1, y + 1, w - 2, h - 2, '#f4f3ee'); rect(x + 1, y + 1, w - 2, 13, '#2f8577');
    rect(x + 4, y + 3, 9, 9, '#f4f3ee'); rect(x + 6, y + 5, 1, 5, '#2f8577'); rect(x + 6, y + 5, 5, 1, '#2f8577'); rect(x + 6, y + 7, 4, 1, '#2f8577'); rect(x + 6, y + 9, 5, 1, '#2f8577');
    text(T.title, x + 17, y + 4);
    lines.forEach((l, i) => text(l, x + 8, y + 18 + i * 11, { col: INK }));
    ctx.globalAlpha = 1;
  }
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > toasts[i].ms) toasts.splice(i, 1);
}

/* ---------- звук (после первого касания) ---------- */
const SND = { ac: null, on: loadStr('d67_sound', '1') === '1' };
function audioUnlock() { if (!SND.ac) { try { SND.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(freq, dur = .04, type = 'square', vol = .04, delay = 0) {
  if (!SND.on || !SND.ac) return;
  try {
    const t0 = SND.ac.currentTime + delay, o = SND.ac.createOscillator(), g = SND.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(SND.ac.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) {}
}
const sfx = {
  knock: () => { beep(110, .07, 'triangle', .25); beep(95, .07, 'triangle', .25, .16); beep(100, .07, 'triangle', .22, .32); },
  door: () => { beep(220, .12, 'sawtooth', .03); beep(160, .15, 'sawtooth', .03, .1); },
  stamp: () => { beep(70, .12, 'square', .12); beep(523, .08, 'square', .04, .12); beep(784, .12, 'square', .04, .2); },
  no: () => { beep(200, .12, 'square', .05); beep(140, .18, 'square', .05, .12); },
  step: () => beep(60 + Math.random() * 20, .03, 'triangle', .04),
  select: () => beep(660, .03, 'square', .03),
  blip: (p) => beep(p, .025, 'square', .025),
};

/* ---------- переход «чёрный круг» ---------- */
const trans = { phase: null, t: 0, x: W / 2, y: H / 2, cb: null };
function irisTo(x, y, cb) { if (trans.phase) return; Object.assign(trans, { phase: 'out', t: 0, x, y, cb }); }
function irisFrom(x, y) { Object.assign(trans, { phase: 'in', t: 0, x, y, cb: null }); }
// переход «пиксельным градиентом»: экран заполняется квадратами сверху вниз,
// край размыт случайным шумом (как в референсе), потом так же открывается
const TR_CELL = 8, TR_COLS = Math.ceil(W / TR_CELL), TR_ROWS = Math.ceil(H / TR_CELL);
const TR_NOISE = Array.from({ length: TR_COLS * TR_ROWS }, (_, i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); });
function drawTrCells(k, cover) {
  // клетки всегда целые квадраты; край волны — 3 ступени серого, как пиксельный градиент
  const shades = ['rgba(11,12,16,.35)', 'rgba(11,12,16,.65)', '#0b0c10'];
  for (let ry = 0; ry < TR_ROWS; ry++) for (let cx = 0; cx < TR_COLS; cx++) {
    const th = (ry / TR_ROWS) * .65 + TR_NOISE[ry * TR_COLS + cx] * .35;
    let v = (k * 1.45 - th) / .2; v = cover ? v : 1 - v; if (v <= 0) continue;
    ctx.fillStyle = shades[Math.min(2, Math.floor(v * 3))];
    ctx.fillRect(cx * TR_CELL, ry * TR_CELL, TR_CELL, TR_CELL);
  }
}
function drawIris(dt) {
  if (!trans.phase) return;
  trans.t += dt; const D = 380, k = Math.min(1, trans.t / D);
  if (trans.phase === 'out') { drawTrCells(k, true); if (k >= 1) { const cb = trans.cb; trans.phase = 'hold'; trans.t = 0; cb && cb(); } }
  else if (trans.phase === 'hold') { ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, W, H); }
  else { drawTrCells(k, false); if (k >= 1) trans.phase = null; }
}

/* ---------- сцены и главный цикл ---------- */
const scenes = {}; let scene = null;
function go(name, data, from) {
  scene = scenes[name]; clicks = []; toasts.length = 0; for (const k in pressed) pressed[k] = false;
  if (typeof musicFor === 'function') musicFor(name);
  scene.enter && scene.enter(data || {});
  const p = from || (scene.focus ? scene.focus() : { x: W / 2, y: H / 2 });
  irisFrom(p.x, p.y);
}
let last = performance.now();
function frame(now) {
  const dt = clamp(now - last, 0, 50); last = now;
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  if (scene) { scene.update && scene.update(dt); scene.draw && scene.draw(dt); }
  drawToasts(dt);
  if (typeof drawNet === 'function') drawNet(dt);
  drawIris(dt);
  clicks = []; for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}

/* ============================================================
   МУЗЫКА: чиптюн/лоу-фай на WebAudio, без файлов.
   Три темы: calm (меню, пролог, «Мой ЖК»), tour (обход подъезда), quiz (викторина).
   Играет, только когда включён звук; стартует после первого касания (так требуют браузеры).
   ============================================================ */
const MUS = { track: null, want: null, step: 0, next: 0, timer: null, out: null };
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
const CH_ = { Am7: [57, 60, 64, 67], Fmaj7: [53, 57, 60, 64], Cmaj7: [48, 52, 55, 59], G6: [55, 59, 62, 64], Dm7: [50, 53, 57, 60], G7: [55, 59, 62, 65], Em7: [52, 55, 59, 62], Am: [57, 60, 64], F: [53, 57, 60], C: [48, 52, 55], G: [55, 59, 62] };
const _ = null;
const TRACKS = {
  // спокойная ночная тема: арпеджио, мягкий бас, мелодия в ля-миноре
  calm: { bpm: 76, prog: ['Am7', 'Fmaj7', 'Cmaj7', 'G6'], lead: 'triangle', leadVol: .5, hats: false,
    mel: [[76, _, 74, 72, _, 69, _, _], [72, _, 74, 76, _, 79, _, 76], [76, _, _, 74, 72, _, 74, _], [74, _, 72, _, 69, _, _, _],
          [81, _, 79, 76, _, 74, _, _], [76, _, 79, _, 81, _, 79, _], [76, _, 74, _, 72, 74, _, _], [69, _, _, _, _, _, _, _]] },
  // обход: чуть быстрее, хэты на слабых долях, бас ходит восьмыми
  tour: { bpm: 100, prog: ['Dm7', 'G7', 'Cmaj7', 'Am7'], lead: 'square', leadVol: .28, hats: true, walk: true,
    mel: [[74, _, 77, _, 76, 74, 72, _], [71, _, 74, _, 79, _, 77, _], [76, _, 72, _, 67, _, 72, 74], [76, _, _, 72, _, _, _, _],
          [74, 76, 77, _, 81, _, 79, 77], [79, _, 77, _, 74, _, 71, _], [72, _, 76, _, 79, _, 76, 74], [72, _, _, _, 69, _, _, _]] },
  // викторина: бодро, как аркада
  quiz: { bpm: 132, prog: ['Am', 'F', 'C', 'G'], lead: 'square', leadVol: .3, hats: true, walk: true,
    mel: [[81, _, 81, 79, 76, _, 74, 76], [77, _, 76, 74, 72, _, 74, _], [76, _, 79, _, 84, _, 83, 79], [79, _, 76, _, 74, _, _, _],
          [81, 79, 81, _, 84, _, 81, _], [77, 76, 74, _, 72, _, 74, _], [76, 79, 84, _, 83, 79, 76, _], [74, _, 71, _, 69, _, _, _]] },
};
const MUSIC_BY_SCENE = { title: 'calm', creator: 'calm', prologue: 'calm', house: 'calm', levels: 'calm', result: 'calm', leaderboard: 'calm', tour: 'tour', quiz: 'quiz' };
function musicFor(sceneName) { MUS.want = MUSIC_BY_SCENE[sceneName] || MUS.want; musicTick(); }
function musicOut() {
  const ac = SND.ac; if (!ac) return null;
  if (!MUS.out) { const g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600; g.gain.value = 0; g.connect(f); f.connect(ac.destination); MUS.out = g; }
  return MUS.out;
}
function note(type, freq, t, dur, vol) {
  const ac = SND.ac, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0008, t + dur); o.connect(g); g.connect(musicOut()); o.start(t); o.stop(t + dur + .05);
}
function hat(t, vol) {
  const ac = SND.ac, n = Math.floor(ac.sampleRate * .04), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'highpass'; f.frequency.value = 6000; g.gain.value = vol;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(musicOut()); s.start(t);
}
function musicTick() {
  const ac = SND.ac; if (!ac) return;
  const out = musicOut(), on = SND.on && MUS.want && !document.hidden;
  // плавно глушим при выключенном звуке; смена темы — с начала такта
  out.gain.setTargetAtTime(on ? .055 : 0, ac.currentTime, .3);
  if (!on) return;
  if (MUS.track !== MUS.want) { MUS.track = MUS.want; MUS.step = 0; MUS.next = Math.max(MUS.next, ac.currentTime + .1); }
  const T = TRACKS[MUS.track], e = 60 / T.bpm / 2;          // восьмая
  while (MUS.next < ac.currentTime + .35) {
    const s = MUS.step, bar = Math.floor(s / 8) % T.mel.length, i = s % 8, ch = CH_[T.prog[bar % T.prog.length]], t = MUS.next;
    // бас: корень аккорда октавой ниже (на «ходьбе» — корень/квинта восьмыми)
    if (i === 0 || i === 4 || (T.walk && i % 2 === 0)) note('triangle', midi(ch[0] - 12 + (T.walk && i % 4 === 2 ? 7 : 0)), t, e * (T.walk ? 1.6 : 3.6), .55);
    // арпеджио аккорда
    note('triangle', midi(ch[[0, 1, 2, 3, 2, 1, 2, 3][i] % ch.length] + 12), t, e * 1.8, .16);
    // мелодия
    const m = T.mel[bar][i]; if (m) note(T.lead, midi(m), t, e * 1.9, T.leadVol * .32);
    if (T.hats && i % 2 === 1) hat(t, .05);
    MUS.next += e; MUS.step++;
  }
}
setInterval(musicTick, 120);
document.addEventListener('visibilitychange', musicTick);

   Дом в игре — 104 квартиры (13 этажей × 8). Пороги — от всех квартир дома:
   0 инициативная группа — 10 % «за»; 1 председатель и 2 совет — явка 50 %+1, из голосовавших 50 %+1 «за»;
   3 тариф — 50 %+1 «за» от всех; 4–5 изменение конструкции — 2/3 «за» от всех.

   Время тура — 60 игровых дней. */
const APTS = HOUSE.floors * HOUSE.perFloor;                                // 104

const LEVELS = TOUR_DEFS.map((d, i) => ({
  ...d, id: 'L' + (i + 1), n: i + 1, problem: d.problem || null,
  floors: HOUSE.floors, perFloor: HOUSE.perFloor, heroApt: HOUSE.heroApt,
  start: 0, secPerMin: 3, days: 60,
  awayShare: .22 + i * .02,
  talkerFloor: [3, 5, 4, 9, 2, 6][i], helperAfter: 3, helperFloor: [10, 11, 12, 9, 11, 12][i],
  reward: { first: [120, 180, 220, 320, 380, 420][i], replay: [25, 40, 50, 70, 85, 95][i], perExtra: 3 + i },
  mix: (() => {
    const total = APTS - 1, h = d.hard;
    const share = { apa: .13 - h * .2, mom: .12 - h * .2, student: .12 - h * .15, business: .09, grump: .1 + h * .5, night: .08 + h * .2, renter: .1 + h * .1, ata: .07, teacher: .07 - h * .1, dad: .06, it: .06 + h * .05 };
    const out = []; for (const a in share) for (let k = 0; k < Math.round(share[a] * total); k++) out.push(a);
    while (out.length < total) out.push('mom'); return out.slice(0, total);
  })(),
}));
/* Правила доступа — общие для игры и сервера: H = { won: [...туры], fixed: [...ремонты] } */
const ORDINARY = () => PROBLEMS.filter(p => p.kind !== 'construction');
function tourOpen(t, H) {
  const i = t.n - 1;
  if (i > 0 && !H.won.includes(LEVELS[i - 1].id)) return { ok: false, why: 'prev', need: LEVELS[i - 1] };
  for (const id of t.needFix || []) if (!H.fixed.includes(id)) return { ok: false, why: 'fix', need: PROBLEMS.find(p => p.id === id) };
  if (t.needFixCount && ORDINARY().filter(p => H.fixed.includes(p.id)).length < t.needFixCount) return { ok: false, why: 'fixCount', n: t.needFixCount };
  return { ok: true };
}
// можно ли чинить: обычный ремонт — после избрания председателем, конструкция — после своего собрания
function canFix(p, H) {
  if (H.fixed.includes(p.id)) return { ok: false, why: 'done' };
  const t = p.kind === 'construction' ? TOURS[p.tour] : TOURS.L2;
  if (!H.won.includes(t.id)) return { ok: false, why: p.kind === 'construction' ? 'vote' : 'chair', tour: t };
  return { ok: true };
}
// итог голосования по правилам тура: yes — «за», no — «против»
function ruleText(t) { return L(t.ruleText).replace('{g}', t.goal).replace('{q}', t.quorum || ''); }
function voteOutcome(t, yes, no) {
  const turnout = yes + no;
  if (t.rule === 'quorum') { const need = Math.max(t.goal, Math.floor(turnout / 2) + 1); return { ok: turnout >= t.quorum && yes >= need, need, turnout }; }
  return { ok: yes >= t.goal, need: t.goal, turnout };
}
const TOURS = Object.fromEntries(LEVELS.map(l => [l.id, l]));

    { kz: 'Жоқ. Ешқандай ОСИ-ге қол қоймаймын. Сау бол.', ru: 'Нет. Ни под каким ОСИ подписываться не буду. Всего доброго.', en: 'No. I\'m not signing anything for any OSI. Goodbye.' },
    { kz: 'Тағы жиналыс па? Маған керегі жоқ. Мазаламаңыз.', ru: 'Опять собрания? Мне это не нужно. Не беспокойте.', en: 'Meetings again? I don\'t need this. Don\'t bother me.' },
    { kz: 'Мен бұған қарсымын. Ақшаны жинайсыңдар да, жоғалып кетесіңдер.', ru: 'Я против. Соберёте деньги и пропадёте.', en: 'I\'m against it. You\'ll collect the money and vanish.' },
    { kz: 'Иә, иә, естідім. Жауабым — жоқ.', ru: 'Да-да, слышал(а). Ответ — нет.', en: 'Yes, yes, I\'ve heard. The answer is no.' },

};

/* ============================================================
   API — связь игры с сервером E-KNOT.
   Пока настоящего бэкенда нет, запросы обслуживает заглушка MockServer:
   она ведёт себя как сервер (задержка, редкие ошибки сети, проверка
   результатов), а данные хранит в localStorage браузера.
   Когда появится сервер — в API_CONFIG.baseUrl ставится его адрес,
   и все те же запросы пойдут через fetch. Игру менять не нужно.
   Описание запросов: docs/API.md
   ============================================================ */
/* ---------- параметры запуска из приложения E-KNOT (docs/API.md, раздел 1) ----------
   ?token=…&lang=kz|ru|en&name=…&level=3&tour=1&title=chairman&complex=ЖК%20Нұрлы
   Всё, кроме token, — только для отображения: правду о прогрессе знает сервер. */
const LAUNCH = (() => {
  const q = new URLSearchParams(location.search), s = (k, n) => { const v = (q.get(k) || '').trim(); return v ? v.slice(0, n) : null; };
  const int = (k, lo, hi) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) && v >= lo && v <= hi ? v : null; };
  const token = s('token', 512) || (/^#[A-Za-z0-9-]+$/.test(location.hash) ? location.hash.slice(1) : null);
  const lang = ['kz', 'ru', 'en'].includes(q.get('lang')) ? q.get('lang') : null;
  return { token, lang, name: s('name', 16), level: int('level', 0, 999), tour: int('tour', -1, 5), title: s('title', 32), complex: s('complex', 28) };
})();

const API_CONFIG = {
  baseUrl: null,                 // например 'https://api.e-knot.kz/game/v1'
  latency: [150, 450],           // задержка ответа заглушки, мс
  failRate: .04,                 // доля «обрывов связи» в заглушке (?stable — без них)
};

/* ---------------- заглушка сервера ---------------- */
const MockServer = (() => {
  const DB_KEY = 'kn_server_db';
  const load = () => { try { return JSON.parse(loadStr(DB_KEY, '')) || null; } catch (e) { return null; } };
  const db = load() || {};
  for (const k of ['users', 'profiles', 'runs', 'scores', 'rewards', 'houses']) db[k] = db[k] || {};
  const commit = () => saveStr(DB_KEY, JSON.stringify(db));

  // тестовые жители: так приложение E-KNOT передало бы токен в ссылке (?token=demo)
  const TOKENS = {
    demo:  { userId: 'u-1001', name: 'Әмина', complex: { id: 'c-17', name: 'ЖК «Нұрлы»', city: 'Астана' }, apartment: 13 },
    demo2: { userId: 'u-1002', name: 'Арман', complex: { id: 'c-17', name: 'ЖК «Нұрлы»', city: 'Астана' }, apartment: 7 },
  };
  // соседи и горожане для таблицы рекордов (как будто уже играли)
  const FAKE = [
    ['Динара', 'c-17', 1460], ['Ерлан', 'c-17', 1310], ['Роза апа', 'c-17', 980], ['Тимур', 'c-17', 870], ['Әсел', 'c-17', 640],
    ['Нұрлан', 'c-04', 1720], ['Ольга', 'c-04', 1180], ['Бақыт', 'c-09', 1590], ['Мадина', 'c-09', 1240], ['Асхат', 'c-21', 1390], ['Жанар', 'c-21', 760],
  ];
  const err = (status, code) => { const e = new Error(code); e.status = status; e.code = code; throw e; };
  // дом игрока: отремонтированные проблемы, украшения, выигранные собрания, бонус дня
  const house = id => db.houses[id] || (db.houses[id] = { fixed: [], decor: [], won: [], claimDay: null });
  const houseScore = H => H.fixed.reduce((s, id) => s + PROBLEMS.find(p => p.id === id).pts, 0) + H.decor.reduce((s, id) => s + DECOR.find(d => d.id === id).pts, 0);
  const today = () => new Date().toISOString().slice(0, 10);
  const houseView = (u) => { const H = house(u.userId), prof = db.profiles[u.userId] || {}, score = houseScore(H);
    return { fixed: H.fixed, decor: H.decor, won: H.won, coins: prof.coins || 0, score, bonus: Math.floor(score / 10), claimable: H.claimDay !== today() && score > 0 }; };
  const unlocked = (u, n) => tourOpen(LEVELS[n - 1], house(u.userId)).ok;   // те же правила, что в игре (content.js)
  const FAKE_HOUSES = [['ЖК «Нұрлы»', 'Динара', 'c-17', 880], ['ЖК «Нұрлы»', 'Ерлан', 'c-17', 640], ['ЖК «Нұрлы»', 'Роза апа', 'c-17', 360],
    ['ЖК «Самал»', 'Нұрлан', 'c-04', 1250], ['ЖК «Самал»', 'Ольга', 'c-04', 520], ['ЖК «Көктем»', 'Бақыт', 'c-09', 1010], ['ЖК «Арай»', 'Асхат', 'c-21', 760]];
  const me = token => {
    if (!token) err(401, 'no_session');
    const u = db.users[token]; if (!u) err(401, 'bad_session'); return u;
  };

  const routes = {
    // вход: токен из приложения или гость (без бонусов)
    'POST /auth'({ body }) {
      const t = body.token && TOKENS[body.token], Lp = body.launch || {};
      let user;
      if (t) user = { ...t, guest: false };
      else if (body.token) {
        // любой другой токен — как будто его выдал сервер E-KNOT: имя и ЖК приходят параметрами запуска
        const cid = 'c-' + hashStr(Lp.complex || 'eknot').toString(36);
        user = { userId: 'app-' + hashStr(body.token).toString(36), name: Lp.name || null, complex: { id: cid, name: Lp.complex || 'E-KNOT', city: 'Астана' }, apartment: null, guest: false };
      }
      else {
        const gid = body.deviceId || ('g-' + Math.floor(Math.random() * 1e9));
        user = { userId: gid, name: null, complex: { id: 'guest', name: null, city: 'Астана' }, apartment: null, guest: true };
      }
      if (!user.guest) { user.level = Lp.level ?? null; user.title = Lp.title || null;
        // прогресс из приложения: туры до tour включительно уже пройдены
        if (Lp.tour != null && Lp.tour >= 0) { const H = house(user.userId); for (let i = 0; i <= Lp.tour; i++) if (!H.won.includes(LEVELS[i].id)) H.won.push(LEVELS[i].id); } }
      const session = 's-' + user.userId;
      db.users[session] = user; db.profiles[user.userId] = db.profiles[user.userId] || null; commit();
      return { session, user };
    },
    'GET /profile'({ session }) { const u = me(session); return { profile: db.profiles[u.userId] }; },
    'PUT /profile'({ session, body }) {
      const u = me(session); const p = body.profile || {};
      // сервер не даёт игре самой себе начислить монеты: их меняет только итог тура
      const old = db.profiles[u.userId] || {};
      db.profiles[u.userId] = { ...p, coins: old.coins || 0, rewardsTotal: old.rewardsTotal || 0 }; commit();
      return { ok: true };
    },
    'DELETE /profile'({ session }) {
      const u = me(session); db.profiles[u.userId] = null; delete db.scores[u.userId]; db.rewards[u.userId] = []; delete db.houses[u.userId]; commit(); return { ok: true };
    },
    'POST /tours/start'({ session, body }) {
      const u = me(session); const tour = TOURS[body.tourId]; if (!tour) err(404, 'no_tour');
      // перепрыгнуть нельзя: собрание открывается, только когда предыдущая проблема исправлена
      if (!unlocked(u, tour.n)) err(403, 'locked');
      const runId = 'r-' + Date.now().toString(36) + Math.floor(Math.random() * 1e4);
      db.runs[runId] = { userId: u.userId, tourId: tour.id, startedAt: Date.now(), finished: false }; commit();
      return { runId, startedAt: db.runs[runId].startedAt, tour: { id: tour.id, goal: tour.goal, floors: tour.floors, perFloor: tour.perFloor } };
    },
    // итог: сервер сам считает подписи по журналу событий и проверяет, что всё правдоподобно
    // викторина: монеты в бюджет ЖК и значок «Знаток ЖКХ» (80 % верных с первой попытки)
    'POST /quiz/finish'({ session, body }) {
      const u = me(session), total = clamp(body.total | 0, 0, 30), first = clamp(body.firstTry | 0, 0, total), sec = +body.seconds || 0;
      const suspicious = total < 3 || sec < total * 4;                         // 8 вопросов быстрее 32 секунд не пробежать
      // викторину можно проходить сколько угодно, но монеты — только за первые три прохождения в день
      const qd = today(); const profQ = db.profiles[u.userId] || (db.profiles[u.userId] = {}); if (profQ.quizDay !== qd) { profQ.quizDay = qd; profQ.quizRuns = 0; }
      profQ.quizRuns = (profQ.quizRuns || 0) + 1;
      const coins = suspicious || profQ.quizRuns > 3 ? 0 : clamp(body.coins | 0, 0, total * 10);
      const prof = db.profiles[u.userId] || (db.profiles[u.userId] = {}); prof.coins = (prof.coins || 0) + coins;
      let reward = null; db.rewards[u.userId] = db.rewards[u.userId] || [];
      const expert = !suspicious && total >= 5 && first / total >= .8;
      if (expert && !db.rewards[u.userId].some(r => r.badge === 'zhkh_expert')) {
        reward = { tourId: 'quiz', points: 100, badge: 'zhkh_expert', status: u.guest ? 'needs_login' : 'sent', at: Date.now() }; db.rewards[u.userId].push(reward); }
      commit(); return { coins, badge: expert ? 'zhkh_expert' : null, reward, suspicious, totalCoins: prof.coins, limit: !suspicious && profQ.quizRuns > 3 };
    },
    'POST /tours/finish'({ session, body }) {
      const u = me(session); const run = db.runs[body.runId];
      if (!run || run.userId !== u.userId) err(404, 'no_run');
      if (run.finished) return run.result;                                     // повторная отправка — тот же ответ
      const tour = TOURS[run.tourId], maxApt = tour.floors * tour.perFloor;
      const seconds = (Date.now() - run.startedAt) / 1000;
      // голос квартиры — последнее её событие «за» или «против»; «за» после «против» — передумал
      const vote = new Map(), via = new Map();
      for (const e of body.events || []) if ((e.t === 'yes' || e.t === 'no') && e.apt >= 1 && e.apt <= maxApt && e.apt !== tour.heroApt) {
        if (e.t === 'no' && vote.get(e.apt) === 'yes') continue;
        vote.set(e.apt, e.t); if (e.t === 'yes') via.set(e.apt, e.via || 'door'); }
      const yesN = [...vote.values()].filter(v => v === 'yes').length, noN = [...vote.values()].filter(v => v === 'no').length;
      const suspicious = seconds < 15 && yesN > 3;                           // 4+ голоса за 15 секунд не бывает
      const own = suspicious ? 0 : yesN, against = suspicious ? 0 : noN, online = suspicious ? 0 : [...via.values()].filter(v => v === 'online').length;
      const remote = 0, signatures = own;
      const out = voteOutcome(tour, own, against), success = out.ok;
      const score = signatures * 100 + online * 20 + (success ? 300 + Math.max(0, Math.round(600 - seconds) * 2) : 0);
      // бюджет: за первую победу на собрании — больше, за повтор — меньше; сверх нормы — доплата за подпись
      const H = house(u.userId), first = success && !H.won.includes(tour.id);
      // доплата сверх нормы — только за голоса, собранные лично у дверей, и не больше 10; онлайн и рассылка енота денег не дают
      const doorYes = [...via.entries()].filter(([a, v]) => vote.get(a) === 'yes' && ['door', 'helper', 'council'].includes(v)).length;
      const coins = success ? (first ? tour.reward.first : tour.reward.replay) + clamp(doorYes - tour.goal, 0, 10) * tour.reward.perExtra : Math.min(own, tour.goal) * 4;
      if (success && first) H.won.push(tour.id);
      const prof = db.profiles[u.userId] || (db.profiles[u.userId] = {});
      prof.coins = (prof.coins || 0) + coins;
      const prevBest = (db.scores[u.userId] || {}).best || 0, best = Math.max(prevBest, score);
      db.scores[u.userId] = { name: prof.name || u.name || 'Ойыншы', complex: u.complex.id, best };
      // бонусы в приложение — только вошедшим через E-KNOT и только за первую победу в туре
      let reward = null; db.rewards[u.userId] = db.rewards[u.userId] || [];
      if (success && !db.rewards[u.userId].some(r => r.tourId === tour.id)) {
        reward = { tourId: tour.id, points: 50 + tour.n * 10, badge: tour.badge, status: u.guest ? 'needs_login' : 'sent', at: Date.now() };
        if (!u.guest) { db.rewards[u.userId].push(reward); prof.rewardsTotal = (prof.rewardsTotal || 0) + reward.points; }
      }
      run.finished = true;
      run.result = { signatures, own, remote, online, against, turnout: out.turnout, need: out.need, success, first, score, best, newBest: score > prevBest, coins, totalCoins: prof.coins, reward, suspicious, problem: tour.problem,
        badges: success && first ? [tour.badge] : [] };
      commit();
      return run.result;
    },
    'GET /house'({ session }) { return houseView(me(session)); },
    // покупка ремонта или украшения: сервер проверяет порядок, одобрение собрания и бюджет
    'POST /house/buy'({ session, body }) {
      const u = me(session), H = house(u.userId), prof = db.profiles[u.userId] || (db.profiles[u.userId] = {});
      const pi = PROBLEMS.findIndex(p => p.id === body.id), dc = DECOR.find(d => d.id === body.id);
      let cost;
      if (pi >= 0) {
        const p = PROBLEMS[pi];
        if (H.fixed.includes(p.id)) err(409, 'already');
        const ok = canFix(p, H); if (!ok.ok) err(403, ok.why === 'chair' ? 'not_chairman' : 'no_vote');
        cost = p.cost;
      } else if (dc) {
        if (H.decor.includes(dc.id)) err(409, 'already');
        if (H.fixed.length < dc.after) err(403, 'locked');
        cost = dc.cost;
      } else err(404, 'no_item');
      if ((prof.coins || 0) < cost) err(402, 'no_money');
      prof.coins -= cost; (pi >= 0 ? H.fixed : H.decor).push(body.id);
      db.scores[u.userId] = { ...(db.scores[u.userId] || { name: prof.name || u.name || 'Ойыншы', complex: u.complex.id, best: 0 }), house: houseScore(H) };
      commit(); return houseView(u);
    },
    // бонус дня в приложение — от того, насколько хорош дом
    'POST /house/claim'({ session }) {
      const u = me(session), H = house(u.userId), v = houseView(u);
      if (!v.claimable) err(409, 'claimed');
      H.claimDay = today(); db.rewards[u.userId] = db.rewards[u.userId] || [];
      const reward = { tourId: 'daily', points: v.bonus, status: u.guest ? 'needs_login' : 'sent', at: Date.now() };
      if (!u.guest) db.rewards[u.userId].push(reward);
      commit(); return { reward, house: houseView(u) };
    },
    'GET /leaderboard'({ session, query }) {
      const u = me(session);
      if (query.scope === 'house') {   // лучший ЖК: по состоянию дома — из них выбирают победителей розыгрыша
        const rows = FAKE_HOUSES.map(([complex, name, cid, best]) => ({ name: complex + ' · ' + name, best }));
        const mineScore = houseScore(house(u.userId)); const nm = (db.profiles[u.userId] || {}).name || u.name || 'Ойыншы';
        rows.push({ name: (u.complex.name || 'ЖК') + ' · ' + nm, best: mineScore, me: true });
        rows.sort((a, b) => b.best - a.best);
        const list = rows.map((r, i) => ({ rank: i + 1, name: r.name, best: r.best, me: !!r.me }));
        return { scope: 'house', top: list.slice(0, 8), mine: list.find(r => r.me) };
      }
      const scope = query.scope === 'city' ? 'city' : 'complex';
      const rows = FAKE.map(([name, complex, best]) => ({ name, complex, best }));
      for (const [id, s] of Object.entries(db.scores)) rows.push({ ...s, me: id === u.userId });
      let list = rows.filter(r => scope === 'city' || r.complex === u.complex.id || r.me);
      list.sort((a, b) => b.best - a.best);
      list = list.map((r, i) => ({ rank: i + 1, name: r.name, best: r.best, me: !!r.me }));
      return { scope, complexName: u.complex.name, top: list.slice(0, 8), mine: list.find(r => r.me) || null };
    },
    'GET /rewards'({ session }) { const u = me(session); return { rewards: db.rewards[u.userId] || [], guest: u.guest }; },
  };

  return {
    debugDB: () => db,   // только для автотестов
    async handle(method, path, { session, body, query }) {
      const [lo, hi] = API_CONFIG.latency; await wait(lo + Math.random() * (hi - lo));
      if (!/[?&]stable/.test(location.search) && Math.random() < API_CONFIG.failRate) err(0, 'network');
      const fn = routes[method + ' ' + path]; if (!fn) err(404, 'no_route');
      // как настоящий сервер: отдаём копию, а не ссылку на свои данные
      return JSON.parse(JSON.stringify(fn({ session, body: body || {}, query: query || {} })));
    },
  };
})();

/* ---------------- клиент: одна функция для заглушки и для настоящего сервера ---------------- */
const NET = { pending: 0, lastError: null };
async function request(method, path, { body, query } = {}, tries = 3) {
  NET.pending++;
  try {
    for (let i = 0; ; i++) {
      try {
        if (!API_CONFIG.baseUrl) return await MockServer.handle(method, path, { session: API.session, body, query });
        const qs = query ? '?' + new URLSearchParams(query) : '';
        const res = await fetch(API_CONFIG.baseUrl + path + qs, {
          method, headers: { 'Content-Type': 'application/json', ...(API.session ? { Authorization: 'Bearer ' + API.session } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) { const e = new Error('http_' + res.status); e.status = res.status; throw e; }
        return await res.json();
      } catch (e) {
        // сеть мигнула — повторяем с паузой; ошибки вроде 401/404 не повторяем
        if (e.status || i >= tries - 1) { NET.lastError = e; throw e; }
        await wait(400 * (i + 1));
      }
    }
  } finally { NET.pending--; }
}

const API = {
  session: null, user: null,
  async auth() {
    const q = new URLSearchParams(location.search);
    let deviceId = loadStr('kn_device', ''); if (!deviceId) { deviceId = 'g-' + Math.floor(Math.random() * 1e9); saveStr('kn_device', deviceId); }
    // токен из ссылки приложения: ?token=demo (или #demo — так работает и опубликованная страница)
    const token = LAUNCH.token;
    const r = await request('POST', '/auth', { body: { token, deviceId, launch: { name: LAUNCH.name, complex: LAUNCH.complex, level: LAUNCH.level, tour: LAUNCH.tour, title: LAUNCH.title } } });
    this.session = r.session; this.user = r.user;
    return { ...r.user, fromApp: !r.user.guest };
  },
  async load() { return (await request('GET', '/profile')).profile; },
  async save(profile) { return request('PUT', '/profile', { body: { profile } }); },
  async reset() { return request('DELETE', '/profile'); },
  async tourStart(tourId) { return request('POST', '/tours/start', { body: { tourId } }); },
  async tourFinish(run, events) { return request('POST', '/tours/finish', { body: { runId: run && run.runId, events } }, 4); },
  async leaderboard(scope) { return request('GET', '/leaderboard', { query: { scope } }); },
  async rewards() { return request('GET', '/rewards'); },
  async house() { return request('GET', '/house'); },
  async quizFinish(b) { return request('POST', '/quiz/finish', { body: b }, 4); },
  async buy(id) { return request('POST', '/house/buy', { body: { id } }); },
  async claim() { return request('POST', '/house/claim'); },
};

// перенос старого сохранения (до появления заглушки сервера)
async function migrateOldSave() {
  const old = loadStr('d67_save', '');
  if (!old) return null;
  try { const p = JSON.parse(old); await API.save(p); saveStr('d67_save', ''); return p; } catch (e) { return null; }
}

/* ---------- результат тура для приложения E-KNOT (docs/API.md, раздел 2) ---------- */
const CLIENT_VERSION = '1.5.0';
function buildResult(scene, r) {
  const T = scene.tour, res = Object.values(scene.res);
  const thinking = res.filter(x => x.status === 'thinking').length, notReached = res.filter(x => ['unknown', 'away', 'noanswer'].includes(x.status)).length;
  return {
    version: 1, game: 'korshiler', token: LAUNCH.token, runId: (scene.run && scene.run.runId) || ('local-' + Date.now()),
    tour: T.n - 1, tourCode: T.code, success: !!r.success, rule: T.rule === 'quorum' ? 'quorum_half_plus_one' : T.goal === PCT.twoThirds ? 'two_thirds_of_all' : T.goal === PCT.half ? 'half_plus_one_of_all' : 'tenth_of_all',
    apartments: APTS, votes: { yes: r.signatures, no: r.against ?? scene.against(), undecided: thinking, notReached, turnout: r.turnout ?? (r.signatures + scene.against()) },
    required: { yes: r.need || T.goal, turnout: T.quorum || null }, daysUsed: scene.day(), daysLimit: T.days,
    score: r.score ?? null, firstWin: !!r.first, badges: r.badges || [], startedAt: new Date(scene.startedAt).toISOString(), finishedAt: new Date().toISOString(),

/* Пиксельная крона: клетки 2×2 внутри неровного овала, свет сверху-слева, тень снизу-справа. */

const lerp2 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];

function drawNight(dt) {
  if (NIGHT.lang !== LANG) buildNight();
  NIGHT.t += dt; const t = NIGHT.t;
  sprite(NIGHT.sky, 0, 0);
  for (const s of NIGHT.stars) { ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 900 + s.ph)); rect(s.x, s.y, s.big ? 2 : 1, s.big ? 2 : 1, '#dfe6f2'); }
  ctx.globalAlpha = 1;
  const px = (t / 24) % (W + 240) - 120;
  if (px > 0 && px < W) { const py = 30 + px * .04; rect(px, py, 3, 1, '#7f8fb0'); if (Math.floor(t / 450) % 2) rect(px + 3, py, 1, 1, '#ff5a4a'); }
  sprite(NIGHT.mid, 0, 0);
  for (const b of NIGHT.blinkers) if (Math.sin(t / 380 + b.ph) > .3) rect(b.x, b.y, 1, 1, '#ff4a3a');
  // свет в окнах то гаснет, то загорается
  if (t > NIGHT.next) {
    NIGHT.next = t + 120 + Math.random() * 520;
    const w = NIGHT.windows[Math.floor(Math.random() * NIGHT.windows.length)]; if (!w.fg) w.on = !w.on;
  }
  const S = NIGHT.sign;
  const drawWin = w => {
    if (w.tv) { const f = Math.sin(t / 80 + w.x * 3) > .2; rect(w.x, w.y, w.w, w.h, f ? '#86a6dc' : '#4f6aa8'); return; }
    rect(w.x, w.y, w.w, w.h, w.on ? w.warm : w.off);
    if (w.on && w.h > 3) { rect(w.x, w.y + w.h - 1, w.w, 1, shade(w.warm, -45)); if (w.front && w.w > 4) rect(w.x + (w.w >> 1), w.y, 1, w.h - 1, shade(w.warm, -30)); }
  };
  for (const w of NIGHT.windows) if (!w.fg) drawWin(w);
  // вывеска: горит целиком, изредка одна буква подмигивает
  if (t > S.until) { S.flick = Math.random() < .5 ? Math.floor(Math.random() * S.letters.length) : -1; S.until = t + (S.flick >= 0 ? 160 + Math.random() * 380 : 900 + Math.random() * 2400); }
  const signOk = typeof HOUSE_STATE !== 'undefined' && HOUSE_STATE.fixed.includes('sign');
  if (signOk) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55 + .08 * Math.sin(t / 140); ctx.drawImage(S.glow, S.x - 12, S.y - 12); ctx.restore(); ctx.drawImage(S.on, S.x, S.y); }
  else { ctx.drawImage(S.off, S.x, S.y);   // вывеска сломана: светятся лишь некоторые буквы — её чинят в последнем собрании
    S.letters.forEach(([lx, lw], i) => { if (i % 3 === 1 && Math.sin(t / 170 + i * 2) > -.4) ctx.drawImage(S.on, lx, 0, lw, S.on.height, S.x + lx, S.y, lw, S.on.height); }); }
  if (S.flick >= 0 && Math.floor(t / 60) % 3) { const [lx, lw] = S.letters[S.flick]; ctx.drawImage(S.off, lx, 0, lw, S.off.height, S.x + lx, S.y, lw, S.off.height); }
  // после 2-го тура на крыше стоит антенна (награда видна прямо в меню)
  if (typeof HOUSE_STATE !== 'undefined' && HOUSE_STATE.fixed.includes('antenna')) {
    const q = FF(.95, 0), x = Math.round(q[0]), y = Math.round(q[1]) - 3;
    rect(x, y - 12, 1, 12, '#8792ad'); rect(x - 3, y - 4, 7, 1, '#5d6884');
    rect(x - 5, y - 17, 3, 7, '#cfd6e4'); rect(x - 4, y - 18, 4, 1, '#cfd6e4'); rect(x - 2, y - 15, 3, 1, '#8792ad');
    if (Math.sin(t / 300) > 0) rect(x, y - 13, 1, 1, '#ff4a3a');
  }
  sprite(NIGHT.fg, 0, 0);
  
  for (const s of NIGHT.snow) { s.y += s.v * dt; s.x += s.dx * dt + Math.sin(t / 500 + s.y / 25) * .1; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } rect(Math.round(s.x), Math.round(s.y), s.big ? 2 : 1, 1, s.c); }
}

  if (!DLG.open || !DLG.resolve) return;
  if (DLG.choices) {
    const n = DLG.choices.length;
    if (hit('right')) { DLG.cursor = (DLG.cursor + 1) % n; sfx.select(); }
    if (hit('left')) { DLG.cursor = (DLG.cursor + n - 1) % n; sfx.select(); }
    if (hit('down')) { DLG.cursor = (DLG.cursor + 2) % n; sfx.select(); }
    if (hit('up')) { DLG.cursor = (DLG.cursor + n - 2) % n; sfx.select(); }
    for (let i = 0; i < n; i++) {
      const x = CH.x0 + (i % 2) * CH.colW, y = CH.y0 + Math.floor(i / 2) * CH.rowH;
      if (clickIn(x - 1, y - 1, CH.bw + 2, CH.bh + 2)) { DLG.cursor = i; return choose(); }
    }
    if (hit('act')) return choose();
    return;
  }
  const len = DLG.text.length;
  if (DLG.shown < len) {
    DLG.shown = Math.min(len, DLG.shown + dt * .06);
    DLG.blipAt -= dt; if (DLG.blipAt <= 0) { sfx.blip(DLG.voice + Math.random() * 40); DLG.blipAt = 55; }

function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  // а одинаковые типы не скапливались на соседних этажах
  const apts = []; for (let apt = 1; apt <= tour.floors * tour.perFloor; apt++) if (apt !== tour.heroApt) apts.push(apt);
  const fl = apt => Math.ceil(apt / tour.perFloor);

    const left = pool.slice(), order = apts.slice().sort(() => R() - .5), put = {}, onFloor = {};

  for (let apt = 1; apt <= tour.floors * tour.perFloor; apt++) {
    if (apt === tour.heroApt) continue;
    const a = mix[k++], A = ARCH[a];
    // у каждого жильца своя внешность и имя по полу и возрасту — не «одна моделька на всех»
    const look = varyLook(a, R), pool = namePool(a, look);

    const away = !A.renter && a !== 'apa' && !A.sleeper && R() < tour.awayShare;

      away, returnAt: tour.start + 8 + Math.floor(R() * 34) + (R() < .2 ? 999 : 0), knocks: 0, listened: false, v: (seen[a] = (seen[a] || 0) + 1) + vOff, last: {}, sleeping: !!A.sleeper, door: 0, met: false,

}

  if (Math.random() < 1 / 40) { const w = pick(Math.random, HOUSE_ART.win); w.on = !w.on; }
  for (const w of HOUSE_ART.win) drawHouseWindow(w, t);
  // провода между домом и столбом, кабель интернета по фасаду
  for (let k = 0; k <= 18; k++) { p(300 + k, 62 + Math.round(Math.sin(k / 18 * Math.PI) * 4), '#1c1626'); p(300 + k, 66 + Math.round(Math.sin(k / 18 * Math.PI) * 3), '#1c1626'); }
  for (let k = 0; k <= 16; k++) p(84 + k, 76 + Math.round(Math.sin(k / 16 * Math.PI) * 3), '#1c1626');
  rect(316, 61, 2, 2, '#3a3050'); rect(316, 65, 2, 2, '#3a3050'); rect(82, 75, 2, 2, '#3a3050'); rect(100, 75, 2, 2, '#3a3050');
  for (let yy = HM.top; yy < HM.bottom; yy++) if ((yy - HM.top) % HM.fh !== 0) p(224, yy, '#2a2238');
  // свет у входа: настенный фонарь под козырьком, тёплое пятно на ступенях, лёгкое мерцание
  { const fl = Math.sin(t / 61) > -.92 ? 1 : .45, glow = ctx.createRadialGradient(200, 168, 1, 200, 178, 34);
    glow.addColorStop(0, `rgba(255,214,140,${.38 * fl})`); glow.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = glow; ctx.fillRect(166, 150, 68, 50); ctx.restore();
    rect(197, 167, 6, 2, '#2a2440'); rect(198, 169, 4, 1, fl > .5 ? '#fff1b8' : '#8a7a5a'); }
  const ids = [...PROBLEMS.map(p => p.id), ...DECOR.map(d => d.id)];
  for (const id of ids) {
    let k = has(id) ? 1 : 0;

const GEAR_CACHE = new Map();
function gearSprite(size, step) {
  const key = size + ':' + (step % 16); if (GEAR_CACHE.has(key)) return GEAR_CACHE.get(key);
  const c = makeCanvas(size, size, ({ p }) => {
    const R0 = size / 2, rot = (step % 16) / 16 * (Math.PI * 2 / 8), teeth = 8, rOut = R0 - .5, rBody = R0 * .78, rHole = R0 * .38;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = x + .5 - R0, dy = y + .5 - R0, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx) - rot;
      const tooth = ((a / (Math.PI * 2) * teeth) % 1 + 1) % 1 < .45;
      const edge = tooth ? rOut : rBody;
      if (d > edge || d < rHole) continue;
      const rim = d > edge - 1.2 || d < rHole + 1.2, light = (-dx - dy) / (d || 1);
      p(x, y, rim ? '#2b2733' : light > .45 ? '#e2dcd2' : light > -.2 ? '#b3aaa0' : '#857c74');
    }
  });
  GEAR_CACHE.set(key, c); return c;
}

/* ---------- сцена «Мой ЖК» ---------- */
scenes.house = {
  enter(d) { this.t = 0; this.sel = null; this.anim = null; this.busy = false; setTouch({}); this.refresh(); if (d && d.focus) this.sel = d.focus;
    // подсказка — один раз, пока ничего не отремонтировано
    if (!HOUSE_STATE.fixed.length && !this.hinted) { this.hinted = true; setTimeout(() => toast('E-KNOT', L(UI.hHint), 4200), 500); } },
  refresh() { API.house().then(h => { HOUSE_STATE = h; SAVE.coins = h.coins; }).catch(() => {}); },
  // что можно сделать с вещью сейчас
  status(id) {
    const pi = PROBLEMS.findIndex(p => p.id === id);
    if (pi >= 0) { const P = PROBLEMS[pi], c = canFix(P, HOUSE_STATE);
      if (c.why === 'done') return { kind: 'done' };
      if (!c.ok) { const I = tourInfo(c.tour.n - 1);
        if (!I.open) return { kind: 'locked', text: (c.why === 'chair' ? L(UI.hNeedChair) + ' ' : '') + I.why };
        return { kind: 'vote', text: c.why === 'chair' ? L(UI.hNeedChair) : L(UI.hNeedVote).replace('{n}', c.tour.n), level: c.tour.id }; }
      return { kind: 'buy', cost: P.cost };
    }
    const d = DECOR.find(x => x.id === id);
    if (has(id)) return { kind: 'done' };
    if (HOUSE_STATE.fixed.length < d.after) return { kind: 'locked', text: L(UI.hDecorLock).replace('{n}', d.after) };
    return { kind: 'buy', cost: d.cost };
  },
  async buy(id) {
    if (this.busy) return; this.busy = true;
    try {
      const h = await API.buy(id);
      this.anim = { id, t: 0 }; this.sel = null; sfx.stamp();
      setTimeout(() => { HOUSE_STATE = h; SAVE.coins = h.coins; persist(); }, 1300);
      const p = PROBLEMS.find(x => x.id === id);
      setTimeout(() => { toast('E-KNOT', p ? L(UI.hFixedToast).replace('{p}', L(p.name)) : L(UI.hDecorToast), 3600); this.anim = null; }, 2800);
    } catch (e) { toast('E-KNOT', L(e.code === 'no_money' ? UI.hNoMoney : UI.netFail), 2600); }
    this.busy = false;
  },
  update(dt) {
    this.t += dt; if (this.anim) this.anim.t += dt;
    if (hit('back')) irisTo(W / 2, 120, () => go('title'));
  },
  draw(dt) {
    drawHouseMap(this.t, this.anim);
    // маркеры: «!» — можно действовать, замок — пока закрыто
    const ids = [...PROBLEMS.map(p => p.id), ...DECOR.map(d => d.id)];
    if (!this.anim) for (const id of ids) {
      const st = this.status(id), [cx, cy] = HSPOT[id]; if (st.kind === 'done') continue;
      const pulse = Math.floor(this.t / 350) % 2;
      const mk = (bg, ch) => { const y = cy - 7 - (pulse ? 1 : 0); rect(cx - 7, y + 1, 14, 14, 'rgba(10,8,20,.5)'); rect(cx - 7, y, 14, 14, '#1b1a21'); rect(cx - 6, y + 1, 12, 12, bg); rect(cx - 6, y + 1, 12, 1, '#fff6c8'); text(ch, cx, y + 3, { align: 'center', col: '#1b1a21' }); };
      if (st.kind === 'buy') mk(HOUSE_STATE.coins >= st.cost ? '#f2c94c' : '#a99fc8', '!');
      else if (st.kind === 'vote') mk('#7fc4a8', '?');

    // верхняя панель
    rect(0, 0, W, 19, '#0e111c'); rect(0, 19, W, 1, '#55607c');
    text(`${L(UI.budget)} ₸${HOUSE_STATE.coins}`, 6, 5, { col: '#f2c94c' });
    text(`★${HOUSE_STATE.score}`, 128, 5, { col: '#9fd9c2' });
    if (button(L(UI.meetings), 0, 1, 'primary', { left: 176 })) irisTo(W / 2, 120, () => go('levels'));
    if (button(L(UI.menu), 0, 1, 'dark', { left: 344 })) irisTo(W / 2, 120, () => go('title'));
    if (HOUSE_STATE.claimable && button(`${L(UI.bonusDay)} +${HOUSE_STATE.bonus}`, 0, 34, 'alt', { left: 6 }))
      API.claim().then(r => { HOUSE_STATE = r.house; toast('E-KNOT', L(r.reward.status === 'sent' ? UI.rRewardSent : UI.rRewardGuest).replace('{n}', r.reward.points), 3200); }).catch(() => {});
    // выбор вещи на карте
    if (!this.anim && !this.busy) {
      // нажатие: берём ближайшую вещь к пальцу (зона не меньше 30×30), чтобы маленькие цели тоже нажимались
      const c = clicks.find(c => c.y > 22 && (!this.sel || c.y < 150));
      if (c) { let best = null, bd = 1e9;
        for (const id of ids) { if (this.status(id).kind === 'done') continue; const [cx, cy, w, h] = HSPOT[id];
          const dx = Math.max(0, Math.abs(c.x - cx) - Math.max(15, w / 2)), dy = Math.max(0, Math.abs(c.y - cy) - Math.max(15, h / 2)), d = dx + dy + Math.hypot(c.x - cx, c.y - cy) * .01;
          if (dx === 0 && dy === 0 && d < bd) { bd = d; best = id; } }
        if (best) { clicks.splice(clicks.indexOf(c), 1); this.sel = this.sel === best ? null : best; sfx.select(); } }
    }
    if (this.sel && !this.anim) this.drawPanel(this.sel);
    // нажатие мимо кнопок закрывает карточку снизу
    if (this.sel && clicks.some(c => c.y > 20)) { clicks.length = 0; this.sel = null; }

  },
  drawPanel(id) {
    const p = PROBLEMS.find(x => x.id === id), d = DECOR.find(x => x.id === id), st = this.status(id);
    frameBox(8, 150, W - 16, 70, .95);
    text(L((p || d).name), 16, 157, { col: '#f4f3ee' });

    else text(L(UI.hDecorDesc).replace('{n}', d.pts), 16, 170, { col: '#cfd6e4', size: 6 });
    const bx = 318;

      const ok = HOUSE_STATE.coins >= st.cost;
      text(`₸${st.cost}`, bx, 160, { align: 'center', col: ok ? '#f2c94c' : '#e88a7a' });
      if (button(ok ? L(UI.hFix) : L(UI.hEarn), bx, 178, ok ? 'primary' : 'alt', { w: 120 })) {

    } else if (st.kind === 'vote') {
      wrapText(st.text, 200, 6).slice(0, 2).forEach((l, i) => text(l, 16, 196 + i * 9, { col: '#9fd9c2', size: 6 }));
      if (button(L(UI.hGoVote), bx, 178, 'primary', { w: 120 })) irisTo(W / 2, 120, () => go('tour', { tour: st.level }));
    } else if (st.kind === 'locked') wrapText(st.text, 360, 6).slice(0, 2).forEach((l, i) => text(l, 16, 196 + i * 9, { col: '#8792ad', size: 6 }));
  },
};

    irisTo(this.hx - this.cam + 20, QZ.GY - 30, () => {

        // путь удлиняется: лишний участок с тремя преградами, вопрос (ответы заново перемешаны) — перед финишем
        const extra = { type: 'run', x0: 0, len: 480, obs: [] }; this.segs.splice(idx + 1, 0, extra);
        const goal = this.segs.pop(), q2 = prepQuestion(s.q.src); q2.tries = s.q.tries;
        const runB = { type: 'run', x0: 0, len: 380, obs: [] }, dn = { type: 'door', x0: 0, len: this.doorLen(q2.answers.length), q: q2, doors: [], open: -1, ok: 0 };
        this.segs.push(runB, dn, goal); this.relayout(idx);
        const fill = (seg, n) => { const slot = seg.len / (n + 1); seg.obs = []; for (let i = 1; i <= n; i++) seg.obs.push({ x: seg.x0 + Math.round(slot * i), kind: pick(Math.random, ['boxes', 'bucket', 'wet', 'rat']), hit: false, mx: 0 }); };
        fill(extra, 3); fill(runB, 2); dn.doors = q2.answers.map((_, i) => dn.x0 + 70 + i * 92);
      } else this.relayout(idx);
      this.hx = s.x0 + s.len + 4; this.jy = 0; this.vy = 0; this.cur = null; this.pick = -1; this.fb = null;
      this.cam = clamp(this.hx - 120, 0, Math.max(0, this.totalLen() - W));
      irisFrom(this.hx - this.cam + 20, QZ.GY - 30); this.state = 'run'; setTouch({ act: L(UI.qzJump) });
    });
  },
  async finishRun() {
    if (this.state === 'end') return; this.state = 'end'; setTouch({});
    const sec = Math.round((Date.now() - this.startedAt) / 1000), ratio = this.total ? this.first / this.total : 0, title = ratio >= (this.cfg.titleThreshold ?? .8);
    let res = { coins: this.coins, badge: title ? 'zhkh_expert' : null, offline: true };
    try { res = await API.quizFinish({ firstTry: this.first, total: this.total, wrong: this.wrong, coins: this.coins, seconds: sec }); HOUSE_STATE = await API.house(); } catch (e) {}
    this.result = { ...res, first: this.first, total: this.total, title, sec };
    try { notifyApp('result', { version: 1, game: 'korshiler', token: LAUNCH.token, runId: 'quiz-' + this.startedAt, tour: null, tourCode: 'quiz', success: true,
      quiz: { firstTry: this.first, total: this.total, wrong: this.wrong }, coins: res.coins, badges: res.badge ? [res.badge] : [], startedAt: new Date(this.startedAt).toISOString(),
      finishedAt: new Date().toISOString(), lang: LANG, clientVersion: CLIENT_VERSION }); } catch (e) {}
  },
  drawWorld() {
    const cx = Math.round(this.cam), GY = QZ.GY, t = this.t;
    for (let x = -(cx % 240); x < W; x += 240) ctx.drawImage(QZ.wall, x, 0);
    // декор по модулям 240 px: окно / объявления / щиток — по хешу номера модуля
    const m0 = Math.floor(cx / 240) - 1;
    for (let m = m0; m < m0 + 4; m++) { const h = hash(m), x = m * 240 - cx;
      if (h < .4) sprite(QZ.deco.window, x + 20, 52); else if (h < .7) { sprite(QZ.deco.notes, x + 30, 64); sprite(QZ.deco.vent, x + 6, 50); } else sprite(QZ.deco.box, x + 150, 40);
      if (hash(m + 50) < .5) sprite(QZ.deco.switch, x + 214, 90); }
    // лампы: конус света на стену и пятно на полу
    for (let m = m0; m < m0 + 4; m++) { const x = m * 240 + 120 - cx, flick = hash(m + 9) < .2 && Math.sin(t / 70 + m) > .6;
      if (!flick) { ctx.drawImage(QZ.cone, x - 80, 52); }
      sprite(QZ.lamp, x - 12, 42); if (!flick) ctx.drawImage(QZ.glow, x - 45, 46); }
    // пол: кафель в перспективе, блики от ламп
    for (let y = GY; y < H; y++) { const k = (y - GY) / (H - GY); rect(0, y, W, 1, `rgb(${70 - k * 22 | 0},${82 - k * 26 | 0},${76 - k * 24 | 0})`); }
    for (const yy of [3, 8, 15, 25, 39]) rect(0, GY + yy, W, 1, 'rgba(40,50,46,.6)');
    const vx = W / 2; for (let wx = Math.floor(cx / 36) * 36 - 36; wx < cx + W + 72; wx += 36) { const sx = wx - cx, bx = vx + (sx - vx) * 1.9;
      ctx.strokeStyle = 'rgba(40,50,46,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx + .5, GY); ctx.lineTo(bx + .5, H); ctx.stroke(); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let m = m0; m < m0 + 4; m++) { const x = m * 240 + 120 - cx; ctx.globalAlpha = .7; ctx.drawImage(QZ.pool, x - 80, GY + 1); ctx.globalAlpha = 1; ctx.drawImage(QZ.streak, x - 8, GY + 2); }
    ctx.restore();
    rect(0, GY, W, 1, '#5e6c66');
  },
  draw(dt) {
    if (this.state === 'loading') { rect(0, 0, W, H, '#0b0c10'); return; }
    const cx = Math.round(this.cam), GY = QZ.GY, t = this.t;
    this.drawWorld();
    // двери-ответы с табличками и лампой над дверью; выбранная открывается
    for (const s of this.segs) {
      if (s.type === 'door') s.doors.forEach((dx, i) => { const x = dx - cx; if (x < -40 || x > W + 40) return;
        const lit = s === this.cur && (this.state === 'ask' || this.pick === i);
        if (s.open === i) { const k = s.ok;
          const hw = (DW >> 1) - 3, ih = DH - 3;
          rect(x - hw, GY - ih, hw * 2, ih, '#2a2018'); ctx.fillStyle = 'rgba(242,198,106,.55)'; ctx.fillRect(x - hw, GY - ih, hw * 2, ih);
          rect(x - hw + 5, GY - ih + 10, 4, 22, '#5a3a2a'); rect(x - hw + 4, GY - ih + 9, 6, 1, '#3a2a1a');
          const dw = Math.max(5, Math.round(hw * 2 * (1 - k)));
          rect(x - hw - 3, GY - DH, DW, 3, '#2a2d32'); rect(x - hw - 3, GY - DH, 3, DH, '#2a2d32'); rect(x + hw, GY - DH, 3, DH, '#2a2d32');
          rect(x + hw - dw, GY - ih, dw, ih, '#3d4148'); rect(x + hw - dw, GY - ih, 1, ih, '#14121a');
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(242,198,106,${(.07 * k).toFixed(3)})`; ctx.beginPath(); ctx.moveTo(x - hw, GY); ctx.lineTo(x + hw, GY); ctx.lineTo(x + hw + 18, GY + 30); ctx.lineTo(x - hw - 18, GY + 30); ctx.fill(); ctx.restore();
        } else sprite(QZ.door, x - (DW >> 1), GY - DH);
        rect(x - 10, GY - DH - 16, 20, 13, '#14121a'); rect(x - 9, GY - DH - 15, 18, 11, lit ? '#f2c94c' : '#c9c3b0'); rect(x - 9, GY - DH - 15, 18, 1, lit ? '#fbe39a' : '#e4dfcf');
        text('ABCD'[i], x, GY - DH - 13, { align: 'center', col: '#14121a' });
        rect(x - (DW >> 1) + 2, GY + 1, DW - 4, 2, 'rgba(242,210,122,.2)'); });
      if (s.type === 'goal') { const x = s.x0 + 140 - cx; if (x > -60 && x < W + 60) {
        sprite(QZ.goalDoor, x - (DW >> 1), GY - DH); rect(x - 12, GY - DH - 14, 24, 10, '#f4f3ee'); text('ОСИ', x, GY - DH - 13, { align: 'center', col: '#2e6a5a', size: 6 });
        if (!this.bRun) { sprite(runnerSprite(BUMAZHKIN_R, 'idle'), x - 64, GY - 62, true); sprite(QZ.folder, x - 70, GY - 30); }
        else { sprite(runnerSprite(BUMAZHKIN_R, 'run' + ((t / 70 | 0) % 4)), x - 64 + this.bx, GY - 62); sprite(QZ.folder, x - 70, GY - 15); } } }
      if (s.obs) for (const o of s.obs) { const img = o.kind === 'rat' ? QZ.obs[(t / 110 | 0) % 2 ? 'rat0' : 'rat1'] : QZ.obs[o.kind], sx = o.x + o.mx - cx;
        if (sx > -40 && sx < W + 40) { sprite(img, sx, GY - img.height + 1, o.kind === 'rat', o.hit ? .45 : 1);
          ctx.save(); ctx.globalAlpha = .14; ctx.translate(Math.round(sx), GY + img.height); ctx.scale(1, -1); if (o.kind === 'rat') { ctx.translate(img.width, 0); ctx.scale(-1, 1); } ctx.drawImage(img, 0, 0); ctx.restore(); } }
    }
    // герой: отражение в полу, полосы скорости, пыль
    const fr = this.trip > 0 ? 'trip' : this.jy < 0 ? 'jump' : ['run', 'go'].includes(this.state) ? 'run' + ((t / 90 | 0) % 4) : 'idle';
    const alpha = this.state === 'enter' ? clamp(1 - (this.et - 300) / 320, 0, 1) : ['feedback', 'trans'].includes(this.state) ? 0 : this.trip > 0 && (t / 80 | 0) % 2 ? .5 : 1;
    const hsx = Math.round(this.hx - cx), hy = GY - 62 + Math.round(this.jy), img = runnerSprite(this.look, fr);
    if (alpha > 0) {
      ctx.save(); ctx.globalAlpha = .16 * alpha; ctx.translate(hsx, GY * 2 - hy); ctx.scale(1, -1); ctx.drawImage(img, 0, 0); ctx.restore();
      rect(hsx + 12, GY - 1, 28, 2, `rgba(0,0,0,${(.35 * (1 + this.jy / 80)).toFixed(2)})`);
      for (const d of this.dust) { const a = 1 - d.t / 450; ctx.fillStyle = `rgba(190,186,176,${(a * .6).toFixed(2)})`; ctx.fillRect(Math.round(d.x - cx), Math.round(d.y), Math.round(d.s * (1 + d.t / 300)), Math.round(d.s * (1 + d.t / 300))); }
      if (['run', 'go'].includes(this.state) && this.trip === 0) for (let i = 0; i < 3; i++) { const yy = hy + 34 + i * 7, len = 10 + ((t / 60 + i * 3) % 6); rect(hsx - len - 2 + (i === 1 ? -4 : 0), yy, len, 1, 'rgba(230,234,240,.45)'); }
      sprite(img, hsx, hy, false, alpha);
    }
    // передний план с параллаксом и виньетка
    const fx = -((cx * 1.6) % 1100);
    for (let x = fx; x < W; x += 1100) ctx.drawImage(QZ.fg, x, H - 34);
    ctx.drawImage(QZ.vig, 0, 0);
    // HUD
    rect(0, 0, W, 20, 'rgba(14,16,20,.88)');
    if (button('II', 0, 2, 'dark', { left: 2, w: 16 })) this.paused = true;
    for (let i = 0; i < this.total; i++) sprite(QZ.page, 24 + i * 11, 4, false, i < this.done ? 1 : .22);
    text(`₸${this.coins}`, 24 + this.total * 11 + 6, 6, { col: '#f2c94c', size: 6 });
    const prog = clamp(this.hx / this.totalLen(), 0, 1), bx = 250, bw = 140;
    text(L(UI.qzPath), bx - 4, 6, { col: '#9fb0cc', size: 6, align: 'right' });
    rect(bx, 8, bw, 4, '#2b2a33'); rect(bx, 8, Math.round(bw * prog), 4, '#7fc4a8'); rect(bx + bw - 2, 5, 4, 10, '#2e6a5a');
    if (['ask', 'go', 'enter'].includes(this.state) && this.cur) this.drawCard(this.cur.q);
    if (this.state === 'feedback') this.drawFeedback();
    if (this.state === 'intro') this.drawIntro();
    if (this.state === 'end' && this.result) this.drawEnd();
    if (this.paused) this.drawPause();
  },
  drawCard(q) {
    const lines = wrapText(L(q.q), 364, 8).slice(0, 3), ah = 15, h = 12 + lines.length * 11 + q.answers.length * ah + 4;
    frameBox(8, 24, 384, h, .95);
    lines.forEach((l, i) => text(l, 18, 30 + i * 11, { col: '#f4f3ee' }));
    q.answers.forEach((a, i) => { const y = 30 + lines.length * 11 + 3 + i * ah, sel = this.pick === i;
      rect(16, y, 368, ah - 2, sel ? '#3a4a3a' : '#1d2130'); rect(18, y + 2, 11, 9, sel ? '#f2c94c' : '#d8d2bf'); text('ABCD'[i], 23.5, y + 3, { col: '#1a1424', align: 'center', size: 6 });
      const s = L(a), sz = textW(s, 8) > 340 ? 6 : 8; text(s, 34, y + (sz === 8 ? 2 : 4), { col: sel ? '#f2c94c' : '#cfd6e4', size: sz });
      if (this.state === 'ask' && clickIn(16, y, 368, ah - 2)) this.choose(i); });
    if (this.state === 'ask') {
      const c = clicks.find(c => c.y > 24 + h); if (c) { const wx = c.x + this.cam, i = this.cur.doors.findIndex(d => Math.abs(d - wx) < 27); if (i >= 0) { clicks.splice(clicks.indexOf(c), 1); this.choose(i); } }
      const n = q.answers.length; if (hit('up') || hit('left')) this.pick = (this.pick + n - 1) % n; if (hit('down') || hit('right')) this.pick = (this.pick + 1) % n; if (hit('act') && this.pick >= 0) this.choose(this.pick);
    }
  },
  drawFeedback() {
    const f = this.fb, lines = wrapText(f.text, 340, 6).slice(0, 6), h = 34 + lines.length * 9 + (f.ok ? 0 : 11) + 24;
    frameBox(24, 40, 352, h, .96);
    text(f.ok ? L(UI.qzOk) : L(UI.qzNo), W / 2, 48, { align: 'center', col: f.ok ? '#7fe08a' : '#e98f6f' });
    if (f.ok) sprite(QZ.page, W / 2 - 5, 59);
    lines.forEach((l, i) => text(l, W / 2, 72 + i * 9, { align: 'center', col: '#f4f3ee', size: 6 }));
    if (!f.ok) text(L(UI.qzLonger), W / 2, 72 + lines.length * 9 + 1, { align: 'center', col: '#f2c94c', size: 6 });
    if (button(L(UI.next), W / 2, 40 + h - 20, 'primary') || hit('act')) this.next();
  },
  drawIntro() {
    rect(0, 0, W, H, 'rgba(10,12,20,.55)'); frameBox(40, 34, 320, 150, .96);
    rect(52, 50, 78, 108, '#1a1e26'); rect(52, 150, 78, 8, '#2a2e36');
    sprite(runnerSprite(BUMAZHKIN_R, 'idle'), 66, 90, true);
    for (let i = 0; i < 5; i++) { const a = this.t / 700 + i * 1.26; sprite(QZ.page, 86 + Math.round(Math.cos(a) * 28), 78 + Math.round(Math.sin(a) * 16)); }
    text(L(UI.qzTitle), 245, 44, { align: 'center', col: '#f2c94c' });
    wrapText(L(UI.qzIntro).replace('{n}', this.total), 210, 6).slice(0, 10).forEach((l, i) => text(l, 140, 60 + i * 9, { col: '#f4f3ee', size: 6 }));
    if (button(L(UI.qzGo), W / 2, 162, 'primary')) this.state = 'run';
  },
  drawEnd() {
    const r = this.result;
    rect(0, 0, W, H, 'rgba(10,12,20,.55)'); paper(70, 24, 260, 178, 7);
    text(L(UI.qzDone), W / 2, 34, { align: 'center', col: '#2e6a5a' });
    const rows = [[L(UI.qzFirst), `${r.first}/${r.total}`], [L(UI.qzWrongN), String(this.wrong)], [L(UI.rBudget), '+₸' + (r.coins ?? this.coins)]];
    rows.forEach(([a, b], i) => { text(a, 86, 54 + i * 13, { col: INK }); text(b, 314, 54 + i * 13, { col: INK, align: 'right' }); rect(86, 63 + i * 13, 228, 1, '#e2d9c2'); });
    if (r.limit) text(L(UI.qzLimit), W / 2, 90, { align: 'center', col: INK_MUTED, size: 6 });
    const note = r.title ? L(UI.qzTitleGot) : L(UI.qzTitleNeed).replace('{p}', Math.round((this.cfg.titleThreshold ?? .8) * 100));
    wrapText(note, 220, 6).slice(0, 3).forEach((l, i) => text(l, W / 2, 98 + i * 9, { align: 'center', col: r.title ? INK_TEAL : INK, size: 6 }));
    if (r.title) { ctx.save(); ctx.translate(W / 2, 138); ctx.rotate(-.08); ctx.strokeStyle = '#2e6a5a'; ctx.lineWidth = 2; ctx.strokeRect(-62, -10, 124, 20); text(L(TITLES.zhkh_expert).toUpperCase(), 0, -4, { col: '#2e6a5a', align: 'center' }); ctx.restore(); }
    if (button(L(UI.again), W / 2 - 66, 176, 'alt')) irisTo(W / 2, 120, () => go('quiz'));
    if (button(L(UI.toHouse), W / 2 + 66, 176, 'primary')) irisTo(W / 2, 120, () => go('house'));
  },
  drawPause() {
    rect(0, 0, W, H, 'rgba(10,12,20,.7)'); frameBox(110, 60, 180, 96, .96);
    text(L(UI.pause), W / 2, 70, { align: 'center', col: '#f4f3ee' });
    if (button(L(UI.resume), W / 2, 92, 'primary')) this.paused = false;
    if (button(L(UI.quitLevel), W / 2, 118, 'danger')) irisTo(W / 2, 120, () => go('house'));
  },
};
