<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Көршілер — E-KNOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Telegram Mini App: вне Telegram скрипт ничего не делает (initData пустая) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: one letterboxed pixel canvas; touch pads float over the bottom corners. Single deliberate dark frame. */
:root{
  --frame:#15161c; --ink:#f4f3ee; --accent:#f2c94c;
  --pad:rgba(20,22,32,.38); --pad-on:rgba(242,201,76,.55); --line:rgba(244,243,238,.38);
  --font-pixel:"Press Start 2P", ui-monospace, monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--frame);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
#wrap{width:100%;height:100%;display:grid;place-items:center}
/* телефон: игра на весь экран, отступы только под вырез и закругления */
/* отступ под камеру берём одинаковым с обеих сторон — иначе игра съезжает от центра */
.touch body{--side:max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  padding:env(safe-area-inset-top,0px) var(--side) env(safe-area-inset-bottom,0px) var(--side)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0c10;box-shadow:0 0 24px rgba(0,0,0,.55)}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;justify-content:space-between;align-items:flex-end;
  padding:0 calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px))}
.touch #touch{display:flex}
.pad{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:8px}
/* крупные полупрозрачные кнопки поверх игры: не закрывают картинку и легко попадаются пальцем */
.btn{width:clamp(76px,23vh,104px);height:clamp(76px,23vh,104px);border-radius:50%;background:var(--pad);border:2px solid var(--line);display:grid;place-items:center;
  color:rgba(244,243,238,.9);padding:0;cursor:pointer;touch-action:none;font:10px var(--font-pixel);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);text-shadow:0 1px 0 #000}
.btn.small{width:clamp(66px,19vh,88px);height:clamp(66px,19vh,88px)}
.btn.act{width:clamp(88px,27vh,120px);height:clamp(88px,27vh,120px);font-size:11px;padding:0 12px;line-height:1.2;text-align:center;white-space:normal;overflow-wrap:anywhere;border-color:rgba(242,201,76,.6)}
.btn.on{background:var(--pad-on)}
.btn svg{width:38%;height:38%;fill:currentColor}
#fs{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:6;width:40px;height:40px;
  border-radius:8px;background:var(--pad);border:2px solid var(--line);color:var(--ink);display:none;place-items:center;padding:0}
.touch #fs.ok{display:grid}
#fs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.btn[hidden]{display:none!important}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#nameBox{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center}
#nameBox label{font:10px var(--font-pixel);color:#2b2a33}
#nameInput{font:14px var(--font-pixel);padding:8px 10px;width:min(320px,70vw);border:3px solid #1b1a21;background:#f4f3ee;color:#2b2a33;text-align:center}
#nameInput:focus-visible{outline:3px solid var(--accent)}
#rotate{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(43,42,51,.92);border:1px solid var(--accent);color:var(--ink);font:9px/1.6 var(--font-pixel);padding:8px 12px;text-align:center;max-width:calc(100% - 32px)}
@media (orientation:portrait){ .touch #rotate{display:block} }
/* вход через Telegram по номеру телефона */
#tgauth{position:fixed;inset:0;z-index:8;background:var(--frame);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
#tgauth .box{max-width:420px;display:grid;gap:18px;justify-items:center}
#tgauth h1{margin:0;font:16px/1.4 var(--font-pixel);color:var(--accent)}
#tgauth p{margin:0;font:9px/1.9 var(--font-pixel);color:var(--ink)}
#tgauth small{font:8px/1.8 var(--font-pixel);color:#9fb0cc}
#tgauth button{font:10px/1.4 var(--font-pixel);color:#0e111c;background:var(--accent);border:0;border-bottom:4px solid #b8902a;padding:14px 18px;cursor:pointer}
#tgauth button:active{border-bottom-width:1px;transform:translateY(3px)}
/* Telegram во весь экран: игра встаёт ниже кнопок «Закрыть» и «⌄ ⋯», чтобы они не закрывали меню и паузу;
   всё вокруг игры заполняет размытая картинка самой игры — чёрных полей нет */
.tg.touch body{padding-top:0}   /* отступ сверху в Telegram считает fit() в engine.js */
.tg #wrap{padding-top:0}
#bgfill{position:fixed;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);z-index:0;pointer-events:none;
  filter:blur(10px) brightness(.42) saturate(1.15);image-rendering:auto}
#wrap{position:relative;z-index:1}
.tg #fs{display:none!important}
#err{position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#b8443f;color:#fff;font:12px/1.4 ui-monospace,monospace;padding:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<canvas id="bgfill" width="64" height="36" aria-hidden="true"></canvas>
<div id="wrap"><canvas id="cv" aria-label="Игра «Көршілер»"></canvas></div>
<div id="nameBox" hidden><input id="nameInput" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Имя героя"></div>
<div id="rotate"></div>
<button id="fs" aria-label="На весь экран"><svg viewBox="0 0 20 20"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg></button>
<div id="err" hidden></div>
<div id="tgauth" hidden><div class="box"><h1>КӨРШІЛЕР</h1><p id="tgText"></p><button id="tgBtn"></button><small id="tgNote"></small></div></div>
<div id="touch" aria-label="Экранное управление">
  <div class="pad">
    <button class="btn" data-k="left" aria-label="Влево"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    <button class="btn" data-k="right" aria-label="Вправо"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
  </div>
  <div class="pad">
    <div class="col">
      <button class="btn small" data-k="up" aria-label="Вверх"><svg viewBox="0 0 10 10"><path d="M1 7 5 2l4 5z"/></svg></button>
      <button class="btn small" data-k="down" aria-label="Вниз"><svg viewBox="0 0 10 10"><path d="M1 3l4 5 4-5z"/></svg></button>
    </div>
    <button class="btn act" data-k="act" aria-label="Действие"></button>
  </div>
</div>

/* ============================================================
   ДВИЖОК: экран, ввод, текст, кнопки, переходы, звук, сохранения
   Логическое разрешение 400×225, холст рисуется в 3 раза крупнее,
   чтобы при растягивании под экран не терялись строки пикселей.
   ============================================================ */
const W = 400, H = 225, S = 3;
// Широкий экран: всё по-прежнему рисуется в «сцене» 400×225 (кнопки и окна на своих местах, по центру),
// а холст шире — FW (до 520) под пропорцию телефона. Слева и справа по OX логических пикселей —
// там продолжаются фон, улица и подъезд. Для проверки ширину можно задать в ссылке: ?fw=480
const FW = (() => { try { const q = +new URLSearchParams(location.search).get('fw'); if (q) return Math.max(W, Math.min(560, Math.round(q / 2) * 2));
  const a = Math.max(innerWidth, innerHeight), b = Math.max(1, Math.min(innerWidth, innerHeight));
  return Math.max(W, Math.min(520, Math.round(H * a / b / 2) * 2)); } catch (e) { return W; } })();
const OX = (FW - W) / 2;
const FONT = '"Press Start 2P", monospace';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = FW * S; cv.height = H * S;
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if (isTouch) document.documentElement.classList.add('touch');

function fit() {
  const wrap = document.getElementById('wrap');
  // Telegram во весь экран: сверху строка состояния и полоса с кнопками «Закрыть» / «⌄ ⋯» — игра встаёт ниже них
  // в Telegram тоже на весь экран: кнопки «Закрыть» и «⌄ ⋯» лежат поверх игры (так решили — игра и кнопки крупнее)
  const top = 0;
  const k = Math.min(wrap.clientWidth / FW, (wrap.clientHeight - top) / H);
  cv.style.width = Math.floor(FW * k) + 'px';
  cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- ошибки — на экран, чтобы их было видно на скриншоте ---------- */

function fmtLine(s, o = {}) { return String(s).replace(/\{up\}/g, UP).replace(/\{op\}/g, OP()).replace(/\{f\}/g, o.f ?? '').replace(/\{apt\}/g, o.apt ?? '').replace(/\{g\}/g, o.g ?? '').replace(/\{q\}/g, o.q ?? ''); }

const LEVELS = TOUR_DEFS.map((d, i) => ({

function tourOpen(t, H) {

function canFix(p, H) {

  if (p.kind === 'construction') return { ok: false, why: 'vote', tour: TOURS[p.tour] };

}

function ruleText(t) { return fmtLine(L(t.ruleText), { g: t.goal, q: t.quorum || '' }); }
function tourTitle(t) { return fmtLine(L(t.title)); }
function voteOutcome(t, yes, no, ab = 0) {
  const turnout = yes + no + ab;

}

/* ---------- Озвучка: реплика → id из voice/voice_lines.csv → out/<lang>/<id>.mp3 ----------
   Файлов может ещё не быть: тогда тихо остаётся «писк» текста. Ничего не переименовывать — id из таблицы. */
const VOICE = { cur: null, missing: new Set(), ok: new Set(), playing: false };
const vNorm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^0-9a-zа-яәіңғүұқөһ]+/g, '');
const VOICE_RX = { kz: [], ru: [] };
for (const lang of ['kz', 'ru']) for (const [tpl, id] of Object.entries(VOICE_TPL[lang] || {})) {
  const rx = tpl.toLowerCase().replace(/ё/g, 'е').replace(/[.*+?^$()|[\]\\]/g, '\\$&').replace(/\{[a-z]+\}/g, '(.+?)');
  VOICE_RX[lang].push([new RegExp('^' + rx + '$'), id]);
}
function voiceId(t, hero = false) {
  const lang = LANG === 'ru' ? 'ru' : 'kz', k = vNorm(t);
  if (hero && VOICE_HERO[lang][k]) return VOICE_HERO[lang][k];
  if (VOICE_IDS[lang][k]) return VOICE_IDS[lang][k];
  if (VOICE_HERO[lang][k]) return VOICE_HERO[lang][k];
  const low = String(t).toLowerCase().replace(/ё/g, 'е').trim();
  for (const [rx, id] of VOICE_RX[lang]) if (rx.test(low)) return id;
  return null;
}
// Голос играет через Web Audio (как музыка): на iPhone новый <audio> вне касания не стартует,
// а Web Audio после первого касания играет всегда — и в беззвучном режиме тоже (см. audioUnlock).
const VBUF = new Map();   // src → Promise<AudioBuffer>, держим последние ~40
function voiceLoad(src) {
  if (VBUF.has(src)) { const p = VBUF.get(src); VBUF.delete(src); VBUF.set(src, p); return p; }
  const p = fetch(src).then(r => { if (!r.ok) { const e = new Error('missing'); e.missing = true; throw e; } return r.arrayBuffer(); })
    .then(buf => new Promise((res, rej) => SND.ac.decodeAudioData(buf, res, rej)));
  VBUF.set(src, p); if (VBUF.size > 40) VBUF.delete(VBUF.keys().next().value);
  p.catch(e => { VBUF.delete(src); if (e && e.missing) VOICE.missing.add(src); });
  return p;
}
function voiceStop() { VOICE.seq = (VOICE.seq || 0) + 1; if (VOICE.cur) { try { VOICE.cur.stop ? VOICE.cur.stop() : VOICE.cur.pause(); } catch (e) {} VOICE.cur = null; } VOICE.playing = false; }
function voiceSrc(t, heroG) { const id = voiceId(t, !!heroG); return id ? `out/${LANG === 'ru' ? 'ru' : 'kz'}/${heroG ? 'hero_' + heroG + '/' : ''}${id}.mp3` : null; }
function voicePlay(t, heroG = null) {   // heroG: 'f'/'m' — реплика героя, ищем в out/<lang>/hero_f или hero_m
  voiceStop();
  if (!SND.on || !SND.vox) return false;
  const src = voiceSrc(t, heroG); if (!src || VOICE.missing.has(src)) return false;
  return voicePlaySrc(src);
}
function voicePlaySrc(src) {
  const seq = VOICE.seq;
  // Web Audio — когда страница с сервера (fetch работает) и контекст создан; иначе — обычный <audio>
  if (SND.ac && location.protocol !== 'file:') {
    audioUnlock();
    voiceLoad(src).then(buf => {
      if (seq !== VOICE.seq || !SND.on || !SND.vox) return;
      const s = SND.ac.createBufferSource(), g = SND.ac.createGain(); g.gain.value = .95;
      s.buffer = buf; s.connect(g); g.connect(SND.ac.destination);
      s.onended = () => { if (VOICE.cur === s) { VOICE.playing = false; VOICE.cur = null; } };
      VOICE.cur = s; VOICE.playing = true; VOICE.ok.add(src); s.start();
    }).catch(() => { if (seq === VOICE.seq) VOICE.playing = false; });
    return true;
  }
  if (typeof Audio === 'undefined') return false;
  const a = new Audio(src); a.volume = .95; a.setAttribute('playsinline', ''); VOICE.cur = a;
  a.addEventListener('playing', () => { if (VOICE.cur === a) { VOICE.playing = true; VOICE.ok.add(src); } });
  a.addEventListener('ended', () => { if (VOICE.cur === a) VOICE.playing = false; });
  a.addEventListener('error', () => { VOICE.missing.add(src); if (VOICE.cur === a) { VOICE.playing = false; VOICE.cur = null; } });
  a.play().catch(() => { VOICE.playing = false; });
  return true;
}
// кнопка «Проверить звук»: щелчок + реплика апа из первого собрания
function soundTest() { audioUnlock(); sfx.stamp(); setTimeout(() => { voiceStop(); if (SND.on && SND.vox) voicePlaySrc(`out/${LANG === 'ru' ? 'ru' : 'kz'}/apa_init_greet.mp3`); }, 450); }

/* ============================================================
   API — связь игры с сервером E-KNOT.
   Пока настоящего бэкенда нет, запросы обслуживает заглушка MockServer:
   она ведёт себя как сервер (задержка, редкие ошибки сети, проверка
   результатов), а данные хранит в localStorage браузера.
   Когда появится сервер — в API_CONFIG.baseUrl ставится его адрес,
   и все те же запросы пойдут через fetch. Игру менять не нужно.
   Описание запросов: docs/API.md
   ============================================================ */
/* ---------- параметры запуска из приложения E-KNOT (docs/API.md, раздел 1) ----------
   ?token=…&lang=kz|ru&name=…&level=3&tour=1&title=chairman&complex=ЖК%20Нұрлы
   Всё, кроме token, — только для отображения: правду о прогрессе знает сервер. */
const LAUNCH = (() => {
  const q = new URLSearchParams(location.search), s = (k, n) => { const v = (q.get(k) || '').trim(); return v ? v.slice(0, n) : null; };
  const int = (k, lo, hi) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) && v >= lo && v <= hi ? v : null; };
  const token = s('token', 512) || (/^#[A-Za-z0-9-]+$/.test(location.hash) ? location.hash.slice(1) : null);
  const lang = ['kz', 'ru'].includes(q.get('lang')) ? q.get('lang') : null;
  return { token, lang, name: s('name', 16), level: int('level', 0, 999), tour: int('tour', -1, 6), title: s('title', 32), complex: s('complex', 28) };
})();

/* ---------- Telegram Mini App ----------
   Внутри Telegram: вход только после «Поделиться номером» (WebApp.requestContact).
   Серверу уходят initData (подпись Telegram) и ответ requestContact — настоящий сервер проверяет их токеном бота.
   Вне Telegram (обычный браузер) — как раньше: гость или токен приложения E-KNOT. */
const TG = (() => { try { const w = window.Telegram && window.Telegram.WebApp; return w && w.initData ? w : null; } catch (e) { return null; } })();
// отступы Telegram в CSS-пикселях: строка состояния, полоса кнопок, ширина зоны кнопки от края экрана
function tgInsets() {
  if (!TG || !document.documentElement.classList.contains('tg')) return null;
  const css = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
  const safe = (TG.safeAreaInset && TG.safeAreaInset.top) || css('--tg-safe-area-inset-top');
  const content = (TG.contentSafeAreaInset && TG.contentSafeAreaInset.top) || css('--tg-content-safe-area-inset-top');
  if (!safe && !content) return null;
  return { safe, content, pill: 140 };
}
const TG_T = {
  kz: { text: 'Ойнау үшін Telegram-дағы телефон нөміріңмен кір. Нөмір E-KNOT профиліне ғана керек.', btn: 'НӨМІРМЕН КІРУ', note: 'Нөмірсіз ойын ашылмайды.', again: 'Нөмір жіберілмеді. Қайта көріңіз.', old: 'Telegram-ды жаңартыңыз — бұл нұсқа нөмірмен кіруді қолдамайды.' },
  ru: { text: 'Чтобы играть, войди по номеру телефона из Telegram. Номер нужен только для профиля E-KNOT.', btn: 'ВОЙТИ ПО НОМЕРУ', note: 'Без номера игра не откроется.', again: 'Номер не отправлен. Попробуй ещё раз.', old: 'Обнови Telegram — эта версия не умеет входить по номеру.' },
};
async function tgLogin() {
  if (!TG) return null;
  try { TG.ready(); TG.expand(); document.documentElement.classList.add('tg'); setTimeout(fit, 60);
    // Telegram меняет размеры окна и «безопасные» отступы (повернули телефон, включили весь экран) — подгоняем игру
    for (const ev of ['viewportChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged']) try { TG.onEvent(ev, () => setTimeout(fit, 60)); } catch (e) {}
    if (TG.isVersionAtLeast('7.7')) TG.disableVerticalSwipes();          // свайп по игре не должен закрывать окно
    if (TG.isVersionAtLeast('6.1')) { TG.setHeaderColor('#15161c'); TG.setBackgroundColor('#15161c'); }
    if (TG.isVersionAtLeast('8.0') && /android|iphone|ipad/i.test(navigator.userAgent)) TG.requestFullscreen();
  } catch (e) {}
  const u = TG.initDataUnsafe && TG.initDataUnsafe.user || {}, key = 'kn_tg_phone_' + u.id;
  const lang = LAUNCH.lang || (loadStr('d67_lang', '') || (u.language_code === 'ru' ? 'ru' : 'kz')), T = TG_T[lang === 'ru' ? 'ru' : 'kz'];
  if (!LAUNCH.lang && !loadStr('d67_lang', '')) LAUNCH.lang = lang === 'ru' ? 'ru' : 'kz';
  const saved = loadStr(key, ''); if (saved) { try { return { user: u, ...JSON.parse(saved) }; } catch (e) {} }
  const box = document.getElementById('tgauth'), btn = document.getElementById('tgBtn'), txt = document.getElementById('tgText'), note = document.getElementById('tgNote');
  txt.textContent = T.text; btn.textContent = T.btn; note.textContent = T.note; box.hidden = false;
  if (!TG.isVersionAtLeast('6.9')) { note.textContent = T.old; btn.hidden = true; return new Promise(() => {}); }
  return new Promise(done => {
    btn.onclick = () => TG.requestContact((ok, res) => {
      if (!ok) { note.textContent = T.again; try { TG.HapticFeedback.notificationOccurred('error'); } catch (e) {} return; }
      const c = res && res.responseUnsafe && res.responseUnsafe.contact || {};
      const info = { phone: c.phone_number || null, contact: res && res.response || null };   // contact — строка с подписью Telegram для проверки на сервере
      saveStr(key, JSON.stringify(info)); box.hidden = true; done({ user: u, ...info });
      if (!tgWriteOK()) setTimeout(() => tgWriteAsk(), 600);   // сразу после номера — разрешение боту писать (сертификаты, новости)
    });
  });
}

// разрешение боту писать игроку: без него бот не сможет прислать сертификат и напоминания
function tgWriteOK() { if (!TG) return false; const u = TG.initDataUnsafe && TG.initDataUnsafe.user || {}; return !!u.allows_write_to_pm || loadStr('kn_tg_write', '') === 'yes'; }
function tgWriteAsk(cb) {

}

  const me = token => {

    },
    'GET /profile'({ session }) { const u = me(session); return { profile: db.profiles[u.userId] }; },
    'PUT /profile'({ session, body }) {

      return { ok: true };
    },
    'DELETE /profile'({ session }) {
      const u = me(session); db.profiles[u.userId] = null; delete db.scores[u.userId]; db.rewards[u.userId] = []; delete db.houses[u.userId]; commit(); return { ok: true };
    },
    'POST /tours/start'({ session, body }) {
      const u = me(session); const tour = TOURS[body.tourId]; if (!tour) err(404, 'no_tour');

    },
    // итог: сервер сам считает подписи по журналу событий и проверяет, что всё правдоподобно
    // викторина: монеты в бюджет ЖК и значок «Знаток ЖКХ» (80 % верных с первой попытки)
    'POST /quiz/finish'({ session, body }) {
      const u = me(session), total = clamp(body.total | 0, 0, 30), first = clamp(body.firstTry | 0, 0, total), sec = +body.seconds || 0;
      const second = clamp(body.second | 0, 0, total - first), hard = clamp(body.hardFirst | 0, 0, first), tour = TOURS[body.tourId] || null;
      const suspicious = total < 3 || sec < total * 4;                         // 5 вопросов быстрее 20 секунд не пробежать
      const prof = db.profiles[u.userId] || (db.profiles[u.userId] = {}); prof.quizPaid = prof.quizPaid || {}; prof.quizBest = prof.quizBest || {};
      // «знания экономят деньги»: +20 000 ₸ за верный ответ с первой попытки, +5 000 со второй, расчётный +50 000 — только за первый проход квиза тура
      const paidBefore = !!(tour && prof.quizPaid[tour.id]);
      const trips = clamp(body.trips | 0, 0, 200);   // споткнулся о преграду — −1 000 ₸
      const coins = suspicious || !tour || paidBefore ? 0 : Math.max(0, (first - hard) * 20000 + hard * 50000 + second * 5000 - trips * 1000);
      if (tour && !suspicious) { prof.quizPaid[tour.id] = true; prof.quizBest[tour.id] = Math.max(prof.quizBest[tour.id] || 0, first / Math.max(1, total)); }
      prof.coins = (prof.coins || 0) + coins;
      let reward = null; db.rewards[u.userId] = db.rewards[u.userId] || [];
      // значок «Знаток ЖКХ» — за все 7 квизов перед турами (каждый ≥ 80 %)
      const expert = !suspicious && LEVELS.every(l => (prof.quizBest[l.id] || 0) >= .8);
      if (expert && !db.rewards[u.userId].some(r => r.badge === 'zhkh_expert')) {
        reward = { tourId: 'quiz', points: 100, badge: 'zhkh_expert', status: u.guest ? 'needs_login' : 'sent', at: Date.now() }; db.rewards[u.userId].push(reward); }
      commit(); return { coins, badge: expert ? 'zhkh_expert' : null, reward, suspicious, totalCoins: prof.coins, paidBefore };
    },
    'POST /tours/finish'({ session, body }) {
      const u = me(session); const run = db.runs[body.runId];
      if (!run || run.userId !== u.userId) err(404, 'no_run');
      if (run.finished) return run.result;                                     // повторная отправка — тот же ответ
      const tour = TOURS[run.tourId], maxApt = tour.floors * tour.perFloor;
      const seconds = (Date.now() - run.startedAt) / 1000;
      // голос квартиры — последнее её событие «за», «против» или «воздержался»; «за» после «против» — передумал. Кладовые не голосуют
      const vote = new Map(), via = new Map();
      for (const e of body.events || []) if (['yes', 'no', 'abstain'].includes(e.t) && e.apt >= 1 && e.apt <= maxApt && e.apt !== tour.heroApt && !isStorage(e.apt)) {
        if (e.t !== 'yes' && vote.get(e.apt) === 'yes') continue;

      // деньги за победу «с неба» не падают: бюджет полугодия (взносы, повышение, аренда) приходит один раз — после первой победы в туре
      const H = house(u.userId), first = success && !H.won.includes(tour.id);
      const coins = first ? tour.income : 0;

        // решение собрания выполнено: летник, вышка, лифт, крыша (и подвал) появляются сами
        for (const p of PROBLEMS) if (p.kind === 'construction' && p.tour === tour.id && !H.fixed.includes(p.id)) H.fixed.push(p.id); }

      db.scores[u.userId] = { name: prof.name || u.name || 'Ойыншы', complex: u.complex.id, best };
      // бонусы в приложение — только вошедшим через E-KNOT и только за первую победу в туре
      let reward = null; db.rewards[u.userId] = db.rewards[u.userId] || [];
      if (success && !db.rewards[u.userId].some(r => r.tourId === tour.id)) {
        reward = { tourId: tour.id, points: 50 + tour.n * 10, badge: tour.badge, badges: tour.badges || [tour.badge], status: u.guest ? 'needs_login' : 'sent', at: Date.now() };
        if (!u.guest) { db.rewards[u.userId].push(reward); prof.rewardsTotal = (prof.rewardsTotal || 0) + reward.points; }
      }
      run.finished = true;
      run.result = { signatures, own, online, against, abstain, turnout: out.turnout, need: out.need, success, first, score, best, newBest: score > prevBest, coins, totalCoins: prof.coins, reward, suspicious, problem: tour.problem,
        badges: success && first ? (tour.badges || [tour.badge]) : [] };
      commit();
      return run.result;
    },
    'GET /house'({ session }) { return houseView(me(session)); },
    // покупка ремонта или украшения: сервер проверяет порядок, одобрение собрания и бюджет
    'POST /house/buy'({ session, body }) {
      const u = me(session), H = house(u.userId), prof = db.profiles[u.userId] || (db.profiles[u.userId] = {});
      const pi = PROBLEMS.findIndex(p => p.id === body.id), dc = DECOR.find(d => d.id === body.id);
      let cost;
      if (pi >= 0) {
        const p = PROBLEMS[pi];
        if (H.fixed.includes(p.id)) err(409, 'already');
        const ok = canFix(p, H); if (!ok.ok) err(403, ok.why === 'chair' ? 'not_chairman' : 'no_vote');
        cost = p.cost;
      } else if (dc) {
        if (H.decor.includes(dc.id)) err(409, 'already');
        cost = dc.cost;
      } else err(404, 'no_item');
      if ((prof.coins || 0) < cost) err(402, 'no_money');
      prof.coins -= cost; (pi >= 0 ? H.fixed : H.decor).push(body.id);
      db.scores[u.userId] = { ...(db.scores[u.userId] || { name: prof.name || u.name || 'Ойыншы', complex: u.complex.id, best: 0 }), house: houseScore(H) };
      commit(); return houseView(u);
    },
    // бонус дня в приложение — от того, насколько хорош дом
    'POST /house/claim'({ session }) {
      const u = me(session), H = house(u.userId), v = houseView(u);
      if (!v.claimable) err(409, 'claimed');
      H.claimDay = today(); db.rewards[u.userId] = db.rewards[u.userId] || [];
      const reward = { tourId: 'daily', points: v.bonus, status: u.guest ? 'needs_login' : 'sent', at: Date.now() };
      if (!u.guest) db.rewards[u.userId].push(reward);
      commit(); return { reward, house: houseView(u) };
    },
    'GET /leaderboard'({ session, query }) {
      const u = me(session);
      if (query.scope === 'house') {   // лучший ЖК: по состоянию дома — из них выбирают победителей розыгрыша
        const rows = FAKE_HOUSES.map(([complex, name, cid, best]) => ({ name: complex + ' · ' + name, best }));
        const mineScore = houseScore(house(u.userId)); const nm = (db.profiles[u.userId] || {}).name || u.name || 'Ойыншы';
        rows.push({ name: (u.complex.name || 'ЖК') + ' · ' + nm, best: mineScore, me: true });
        rows.sort((a, b) => b.best - a.best);
        const list = rows.map((r, i) => ({ rank: i + 1, name: r.name, best: r.best, me: !!r.me }));
        return { scope: 'house', top: list.slice(0, 8), mine: list.find(r => r.me) };
      }
      const scope = query.scope === 'city' ? 'city' : 'complex';
      const rows = FAKE.map(([name, complex, best]) => ({ name, complex, best }));
      for (const [id, s] of Object.entries(db.scores)) rows.push({ ...s, me: id === u.userId });
      let list = rows.filter(r => scope === 'city' || r.complex === u.complex.id || r.me);
      list.sort((a, b) => b.best - a.best);
      list = list.map((r, i) => ({ rank: i + 1, name: r.name, best: r.best, me: !!r.me }));
      return { scope, complexName: u.complex.name, top: list.slice(0, 8), mine: list.find(r => r.me) || null };
    },
    // Telegram: игрок разрешил/запретил боту писать ему (сертификаты, напоминания)
    'POST /tg/write'({ session, body }) { const u = me(session); u.tgWrite = !!body.allowed; commit(); return { ok: true, allowed: u.tgWrite }; },
    'GET /rewards'({ session }) { const u = me(session); return { rewards: db.rewards[u.userId] || [], guest: u.guest }; },
  };

  return {
    debugDB: () => db,   // только для автотестов
    async handle(method, path, { session, body, query }) {
      const [lo, hi] = API_CONFIG.latency; await wait(lo + Math.random() * (hi - lo));
      if (!/[?&]stable/.test(location.search) && Math.random() < API_CONFIG.failRate) err(0, 'network');
      const fn = routes[method + ' ' + path]; if (!fn) err(404, 'no_route');
      // как настоящий сервер: отдаём копию, а не ссылку на свои данные
      return JSON.parse(JSON.stringify(fn({ session, body: body || {}, query: query || {} })));
    },
  };
})();

/* ---------------- клиент: одна функция для заглушки и для настоящего сервера ---------------- */
const NET = { pending: 0, lastError: null };
async function request(method, path, { body, query } = {}, tries = 3) {
  NET.pending++;
  try {
    for (let i = 0; ; i++) {
      try {
        if (!API_CONFIG.baseUrl) return await MockServer.handle(method, path, { session: API.session, body, query });
        const qs = query ? '?' + new URLSearchParams(query) : '';
        const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, tm = ctl && setTimeout(() => ctl.abort(), API_CONFIG.timeoutMs);
        let res;
        try {
          res = await fetch(API_CONFIG.baseUrl + path + qs, {
            method, signal: ctl && ctl.signal,
            headers: { 'Content-Type': 'application/json', 'X-Client': 'korshiler/' + CLIENT_VERSION, ...(API.session ? { Authorization: 'Bearer ' + API.session } : {}) },
            body: body ? JSON.stringify(body) : undefined,
          });
        } finally { if (tm) clearTimeout(tm); }
        if (!res.ok) {   // ошибка сервера: код из тела { error: 'no_money' } — как у заглушки
          let code = 'http_' + res.status; try { const j = await res.json(); if (j && j.error) code = j.error; } catch (_) {}
          const e = new Error(code); e.status = res.status; e.code = code;
          // сессия истекла — один раз входим заново и повторяем запрос
          if (res.status === 401 && path !== '/auth' && !API.reauthing) { API.reauthing = true; try { await API.auth(); } finally { API.reauthing = false; } continue; }
          throw e;
        }
        return res.status === 204 ? {} : await res.json();
      } catch (e) {
        // сеть мигнула или сервер 5xx — повторяем с паузой; ошибки вроде 400/403/404/409 не повторяем
        if ((e.status && e.status < 500) || i >= tries - 1) { NET.lastError = e; throw e; }
        await wait(400 * (i + 1));
      }
    }
  } finally { NET.pending--; }
}

/* ---------- результат тура для приложения E-KNOT (docs/API.md, раздел 2) ---------- */
const CLIENT_VERSION = '1.6.0';
function buildResult(scene, r) {
  const T = scene.tour, res = Object.values(scene.res);
  const thinking = res.filter(x => x.status === 'thinking').length, notReached = res.filter(x => ['unknown', 'away', 'noanswer'].includes(x.status)).length;
  return {
    version: 1, game: 'korshiler', token: LAUNCH.token, runId: (scene.run && scene.run.runId) || ('local-' + Date.now()),
    tour: T.n - 1, tourCode: T.code, success: !!r.success, rule: T.rule === 'quorum' ? 'quorum_half_plus_one' : T.goal === PCT.twoThirds ? 'two_thirds_of_all' : T.goal === PCT.half ? 'half_plus_one_of_all' : 'tenth_of_all',
    apartments: APTS, protocol: T.n === 1 ? '1' : 'EKN-0' + T.n, eknotShare: scene.appShare ? scene.appShare() : 0,
    votes: { yes: r.signatures, no: r.against ?? scene.against(), abstain: r.abstain ?? scene.abstained(), undecided: thinking, notReached, turnout: r.turnout ?? (r.signatures + scene.against()) },
    required: { yes: r.need || T.goal, turnout: T.quorum || null }, daysUsed: scene.day(), daysLimit: T.days,
    score: r.score ?? null, firstWin: !!r.first, badges: r.badges || [], startedAt: new Date(scene.startedAt).toISOString(), finishedAt: new Date().toISOString(),
    lang: LANG, clientVersion: CLIENT_VERSION, offline: !!r.offline, events: scene.events.map(e => ({ t: e.t, apt: e.apt, via: e.via || 'door' })),
  };
}
// в приложение (WebView) — сразу; ошибок моста не бывает «наружу», игра продолжает работать
function notifyApp(type, payload) {
  const msg = JSON.stringify({ type, payload });
  const tries = [() => window.ReactNativeWebView.postMessage(msg), () => window.webkit.messageHandlers.eknot.postMessage(msg), () => window.EKnot.postMessage(msg)];
  let sent = false; for (const f of tries) { try { f(); sent = true; break; } catch (e) {} }
  try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'korshiler:' + type, payload }, '*'); sent = true; } } catch (e) {}
  window.KORSHILER_LAST = { type, payload, sent };
  return sent;

   НОЧНОЙ ГОРОД — меню и итоги. По референсу автора:
   панельная высотка снизу в три четверти, горящая вывеска,
   за ней город, рядом соседние дома, на переднем плане крыша.
   Слои: небо → звёзды → город и дома → окна → вывеска → передний план → снег

function fillPoly(g, pts, col) {
  g.fillStyle = col;
  const ys = pts.map(p => p[1]), y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
  for (let y = y0; y < y1; y++) {
    const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2) { const xa = Math.round(xs[i]), xb = Math.round(xs[i + 1]); if (xb > xa) g.fillRect(xa, y, xb - xa, 1); }

  // раскладываем по этажам так, чтобы на одном этаже не было двух одинаковых жильцов,
  // а одинаковые типы не скапливались на соседних этажах
  const apts = []; for (let apt = 1; apt <= tour.floors * tour.perFloor; apt++) if (apt !== tour.heroApt && !isStorage(apt)) apts.push(apt);

}

  updateCam(dt) {

  startClimb(d) {

  onTap(x, wy) {

  // на что жалуется жилец: только на то, что ещё не отремонтировано. Чаще — на тему собрания;

  complaint(r) {

  walkTo(x) { const h = this.hero; return new Promise(res => { h.goal = x; h.arrive = res; }); },
  /* ---- крысы: бегают по первому этажу, при виде героя прячутся в норы ---- */
  updateRats(dt) {

    for (const r of this.rats) {
      r.t += dt; r.k += dt;

          r.hole = (away.length ? away : RAT_HOLES).reduce((a, x) => Math.abs(x - r.x) < Math.abs(a - r.x) ? x : a); r.dir = Math.sign(r.hole - r.x) || 1; }

  drawRats(cy, t) {

  /* ---- стук в дверь и разговор ---- */

  fmt(r, v) { const T = this.tour; return fmtLine(typeof v === 'string' ? v : L(v), { f: r.floor, apt: aptNo(r.apt), g: T.goal, q: T.quorum || '' }).replace('{n}', this.signatures()); },
  async visit(r) {

    const sc = A.noVote || A.renter || A.notOwner ? null : scenFor(r.arch, T);
    dlgOpen(r.name, e => portrait(r.look, e), A.voice, A.noVote || A.renter || A.notOwner ? null : () => r.mood, r.look.body === 'f');
    // реплика жильца: из сценария тура, иначе из характера; у каждого свой вариант, реакции без повторов подряд
    const Ln = (k, src) => {
      if (k === 'story') { const c = this.complaint(r); if (c) return this.fmt(r, c); }
      let v = src !== undefined ? src : (sc && sc[k]) || A.lines[k] || GENERIC[k]; if (!v) return '';
      if (!Array.isArray(v)) { if (v.top || v.low) { const top = r.floor === T.floors; v = (top && v.top) || (!top && v.low) || v; } return this.fmt(r, v); }
      if (['good', 'meh', 'bad'].includes(k)) { let i; do i = Math.floor(Math.random() * v.length); while (v.length > 1 && i === r.last[k]); r.last[k] = i; return this.fmt(r, v[i]); }
      let line = v[r.v % v.length]; const top = r.floor === T.floors;

    if (A.noVote) return this.visitShady(r, Ln);

    if (A.notOwner) return this.visitNotOwner(r, Ln, tourLine);

    if (r.status === 'no') { await say(L(GENERIC.againNo), 'angry'); return this.endVisit(r); }
    if (r.status === 'abstain') { await say(Ln('think'), 'think'); return this.endVisit(r); }
    if (r.refuser) { const v = PRO.refuse[(r.apt + r.v) % PRO.refuse.length]; sfx.no(); await say(L(v), 'angry'); r.status = 'no'; this.events.push({ t: 'no', apt: r.apt, via: 'door' }); return this.endVisit(r); }

        if (T.n >= 2 && A.paperOnly) { r.status = 'paper'; pop(DOOR_X[r.d], this.base(r.floor) - 70, '📄', '#d8d2bf'); }
      } else if (c === 'listen') {

      } else {
        this.addTime(1);

        if (c === 'neighbors' && A.likes.neighbors > 0) d += Math.min(14, this.signatures() * 2);

  // жилец решился: «за»; но в некоторых турах характер «за» не голосует — только воздерживается или «подумаю»

  async refuse(r, Ln) { r.status = 'no'; sfx.no(); await say(Ln('no'), 'angry'); this.events.push({ t: 'no', apt: r.apt, via: 'door' }); return this.endVisit(r); },
  abstain(r, via) { r.status = 'abstain'; this.events.push({ t: 'abstain', apt: r.apt, via }); pop(DOOR_X[r.d], this.base(r.floor) - 70, '⏸', '#c9c3b0'); this.checkGoal(300); return this.endVisit(r); },
  // «нехорошая квартира»: дверь открывают нехотя, голоса нет — только намёк

  // арендатор: тур 1 — доверенность хозяйки, с тура 2 — приглашение хозяйке в E-KNOT

const GEAR_CACHE = new Map();
function gearSprite(size, step) {
  const key = size + ':' + (step % 16); if (GEAR_CACHE.has(key)) return GEAR_CACHE.get(key);
  const c = makeCanvas(size, size, ({ p }) => {
    const R0 = size / 2, rot = (step % 16) / 16 * (Math.PI * 2 / 8), teeth = 8, rOut = R0 - .5, rBody = R0 * .78, rHole = R0 * .38;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = x + .5 - R0, dy = y + .5 - R0, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx) - rot;
      const tooth = ((a / (Math.PI * 2) * teeth) % 1 + 1) % 1 < .45;
      const edge = tooth ? rOut : rBody;
      if (d > edge || d < rHole) continue;
      const rim = d > edge - 1.2 || d < rHole + 1.2, light = (-dx - dy) / (d || 1);
      p(x, y, rim ? '#2b2733' : light > .45 ? '#e2dcd2' : light > -.2 ? '#b3aaa0' : '#857c74');
    }
  });
  GEAR_CACHE.set(key, c); return c;
}

    text(L(UI.qzDone), W / 2, 34, { align: 'center', col: '#2e6a5a' });
    const rows = [[L(UI.qzFirst), `${r.first}/${r.total}`], [L(UI.qzWrongN), String(this.wrong)], ...(r.trips ? [[L(UI.qzTrips), `${r.trips} × −1 000 ₸`]] : []), [L(UI.rBudget), '+' + money(r.coins ?? 0)]];
    rows.forEach(([a, b], i) => { text(a, 86, 54 + i * 13, { col: INK }); text(b, 314, 54 + i * 13, { col: INK, align: 'right' }); rect(86, 63 + i * 13, 228, 1, '#e2d9c2'); });
    let ny = 58 + rows.length * 13; if (r.paidBefore) { text(L(UI.qzPaidBefore), W / 2, ny, { align: 'center', col: INK_MUTED, size: 6 }); ny += 10; }
    const note = this.tourId ? (TOURS[this.tourId].n < 2 ? '' : r.bonus ? L(UI.qzBonus) : L(UI.qzNoBonus)) : r.title ? L(UI.qzTitleGot) : L(UI.qzTitleNeed);
    wrapText(note, 220, 6).slice(0, 3).forEach((l, i) => text(l, W / 2, ny + i * 9, { align: 'center', col: r.title ? INK_TEAL : INK, size: 6 }));
    { const nl = note ? wrapText(note, 220, 6).slice(0, 3).length : 0, j = QUIZ_JOKES[(this.startedAt >> 3) % QUIZ_JOKES.length];   // шутка в конце
      wrapText(L(j), 220, 6).slice(0, 2).forEach((l, i) => text(l, W / 2, ny + nl * 9 + 6 + i * 9, { align: 'center', col: '#8a6a3a', size: 6 })); }
    if (r.title) { ctx.save(); ctx.translate(W / 2, 138); ctx.rotate(-.08); ctx.strokeStyle = '#2e6a5a'; ctx.lineWidth = 2; ctx.strokeRect(-62, -10, 124, 20); text(L(TITLES.zhkh_expert).toUpperCase(), 0, -4, { col: '#2e6a5a', align: 'center' }); ctx.restore(); }
    if (button(L(UI.again), W / 2 - 66, 176, 'alt')) irisTo(W / 2, 120, () => go('quiz', { tour: this.tourId, then: this.then }));
    if (this.then) { if (button(L(UI.toMeeting), W / 2 + 66, 176, 'primary')) irisTo(W / 2, 120, () => go('tour', { tour: this.then, skipInter: true })); }
    else if (button(L(UI.toHouse), W / 2 + 66, 176, 'primary')) irisTo(W / 2, 120, () => go('house'));
  },
  drawPause() {
    if (this.pset) { if (drawSoundPanel()) this.pset = false; return; }
    rect(0, 0, W, H, 'rgba(10,12,20,.7)'); frameBox(110, 52, 180, 120, .96);
    text(L(UI.pause), W / 2, 62, { align: 'center', col: '#f4f3ee' });
    if (button(L(UI.resume), W / 2, 84, 'primary', { w: 130 })) this.paused = false;
    if (button(L(UI.settings), W / 2, 108, 'alt', { w: 130 })) this.pset = true;
    if (button(L(UI.quitLevel), W / 2, 142, 'danger', { w: 130 })) irisTo(W / 2, 120, () => this.then ? go('tour', { tour: this.then, skipInter: true }) : go('house'));
  },
};

</script>
