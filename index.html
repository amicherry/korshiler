<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Көршілер — E-KNOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one letterboxed pixel canvas; touch pads float over the bottom corners. Single deliberate dark frame. */
:root{
  --frame:#15161c; --ink:#f4f3ee; --accent:#f2c94c;
  --pad:rgba(20,22,32,.38); --pad-on:rgba(242,201,76,.55); --line:rgba(244,243,238,.38);
  --font-pixel:"Press Start 2P", ui-monospace, monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--frame);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
#wrap{width:100%;height:100%;display:grid;place-items:center}
/* телефон: игра на весь экран, отступы только под вырез и закругления */
/* отступ под камеру берём одинаковым с обеих сторон — иначе игра съезжает от центра */
.touch body{--side:max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  padding:env(safe-area-inset-top,0px) var(--side) env(safe-area-inset-bottom,0px) var(--side)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0c10}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;justify-content:space-between;align-items:flex-end;
  padding:0 calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px))}
.touch #touch{display:flex}
.pad{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:8px}
/* крупные полупрозрачные кнопки поверх игры: не закрывают картинку и легко попадаются пальцем */
.btn{width:clamp(76px,23vh,104px);height:clamp(76px,23vh,104px);border-radius:50%;background:var(--pad);border:2px solid var(--line);display:grid;place-items:center;
  color:rgba(244,243,238,.9);padding:0;cursor:pointer;touch-action:none;font:10px var(--font-pixel);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);text-shadow:0 1px 0 #000}
.btn.small{width:clamp(66px,19vh,88px);height:clamp(66px,19vh,88px)}
.btn.act{width:clamp(88px,27vh,120px);height:clamp(88px,27vh,120px);font-size:11px;border-color:rgba(242,201,76,.6)}
.btn.on{background:var(--pad-on)}
.btn svg{width:38%;height:38%;fill:currentColor}
#fs{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:6;width:40px;height:40px;
  border-radius:8px;background:var(--pad);border:2px solid var(--line);color:var(--ink);display:none;place-items:center;padding:0}
.touch #fs.ok{display:grid}
#fs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.btn[hidden]{display:none!important}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#nameBox{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center}
#nameBox label{font:10px var(--font-pixel);color:#2b2a33}
#nameInput{font:14px var(--font-pixel);padding:8px 10px;width:min(320px,70vw);border:3px solid #1b1a21;background:#f4f3ee;color:#2b2a33;text-align:center}
#nameInput:focus-visible{outline:3px solid var(--accent)}
#rotate{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(43,42,51,.92);border:1px solid var(--accent);color:var(--ink);font:9px/1.6 var(--font-pixel);padding:8px 12px;text-align:center;max-width:calc(100% - 32px)}
@media (orientation:portrait){ .touch #rotate{display:block} }
#err{position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#b8443f;color:#fff;font:12px/1.4 ui-monospace,monospace;padding:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" aria-label="Игра «Көршілер»"></canvas></div>
<div id="nameBox" hidden><input id="nameInput" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Имя героя"></div>
<div id="rotate"></div>
<button id="fs" aria-label="На весь экран"><svg viewBox="0 0 20 20"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg></button>
<div id="err" hidden></div>
<div id="touch" aria-label="Экранное управление">
  <div class="pad">
    <button class="btn" data-k="left" aria-label="Влево"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    <button class="btn" data-k="right" aria-label="Вправо"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
  </div>
  <div class="pad">
    <div class="col">
      <button class="btn small" data-k="up" aria-label="Вверх"><svg viewBox="0 0 10 10"><path d="M1 7 5 2l4 5z"/></svg></button>
      <button class="btn small" data-k="down" aria-label="Вниз"><svg viewBox="0 0 10 10"><path d="M1 3l4 5 4-5z"/></svg></button>
    </div>
    <button class="btn act" data-k="act" aria-label="Действие"></button>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   ДВИЖОК: экран, ввод, текст, кнопки, переходы, звук, сохранения
   Логическое разрешение 400×225, холст рисуется в 3 раза крупнее,
   чтобы при растягивании под экран не терялись строки пикселей.
   ============================================================ */
const W = 400, H = 225, S = 3;
const FONT = '"Press Start 2P", monospace';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W * S; cv.height = H * S;
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if (isTouch) document.documentElement.classList.add('touch');

function fit() {
  const wrap = document.getElementById('wrap');
  // на телефоне — максимально крупно; кнопки полупрозрачные и лежат поверх игры
  const k = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  cv.style.width = Math.floor(W * k) + 'px';
  cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- ошибки — на экран, чтобы их было видно на скриншоте ---------- */
addEventListener('error', e => {
  const el = document.getElementById('err'); if (!el) return;
  el.hidden = false; el.textContent += (e.message || 'Error') + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 4).join('\n') : '') + '\n';
});
addEventListener('unhandledrejection', e => {
  const el = document.getElementById('err'); if (!el) return;
  el.hidden = false; el.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
});

/* ---------- хранилище ---------- */
function loadStr(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- случайные числа с зерном ---------- */
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (R, arr) => arr[Math.floor(R() * arr.length)];

/* ---------- ввод ---------- */
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down', KeyE: 'act', Space: 'act', Enter: 'act', Escape: 'back', KeyB: 'ballot', Tab: 'ballot', KeyR: 'raccoon' };
addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.id === 'nameInput') { if (e.code === 'Enter') { pressed.act = true; } return; }
  const k = KEYMAP[e.code]; if (!k) return;
  if (!keys[k]) pressed[k] = true; keys[k] = true; e.preventDefault(); audioUnlock();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
const hit = k => { const v = !!pressed[k]; pressed[k] = false; return v; };
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('on'); audioUnlock(); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
const touchBtn = k => document.querySelector(`[data-k="${k}"]`);
// какие экранные кнопки нужны сейчас: стрелки «влево/вправо» — только там, где герой ходит
function setTouch({ act = null, up = false, down = false, move = false } = {}) {
  const a = touchBtn('act'); if (a) { a.hidden = act === null; if (act !== null && a.textContent !== act) a.textContent = act; }
  const u = touchBtn('up'), d = touchBtn('down'); if (u) u.hidden = !up; if (d) d.hidden = !down;
  for (const k of ['left', 'right']) { const b = touchBtn(k); if (b) b.hidden = !move; }
}
// на весь экран + альбомная ориентация (Android; на iPhone — через «На экран Домой»)
{ const fs = document.getElementById('fs'), el = document.documentElement;
  if (fs && (el.requestFullscreen || el.webkitRequestFullscreen)) {
    fs.classList.add('ok');
    fs.addEventListener('click', async () => {
      try { if (document.fullscreenElement) await document.exitFullscreen(); else { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {}); } } catch (err) {}
      setTimeout(fit, 200);
    });
  } }

/* мышь и касания по холсту: щелчки собираются за кадр, кнопки проверяют их сами */
let clicks = [];
const pointer = { x: -1, y: -1 };
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => { audioUnlock(); const p = toLogical(e); clicks.push(p); });
cv.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; });
const TAP_PAD = isTouch ? 3 : 0;   // палец толще курсора: зона нажатия чуть больше кнопки
function clickIn(x, y, w, h) {
  const p = TAP_PAD, i = clicks.findIndex(c => c.x >= x - p && c.x < x + w + p && c.y >= y - p && c.y < y + h + p);
  if (i < 0) return false; clicks.splice(i, 1); return true;
}

/* ---------- текст ---------- */
function font(size = 8) { ctx.font = `${size}px ${FONT}`; }
function text(s, x, y, o = {}) {
  const { col = '#f4f3ee', size = 8, align = 'left', shadow = null } = o;
  font(size); ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, Math.round(x), Math.round(y) + 1); }
  ctx.fillStyle = col; ctx.fillText(s, Math.round(x), Math.round(y));
}
function textW(s, size = 8) { font(size); return ctx.measureText(s).width; }
function wrapText(s, maxW, size = 8) {
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (textW(t, size) > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}

/* ---------- примитивы ---------- */
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const P = { g, w, h,
    r: (x, y, ww, hh, col) => { if (!col) return; g.fillStyle = col; g.fillRect(x | 0, y | 0, ww | 0, hh | 0); },
    p: (x, y, col) => { if (!col) return; g.fillStyle = col; g.fillRect(x | 0, y | 0, 1, 1); },
    line: (x0, y0, x1, y1, col) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; g.fillStyle = col;
      for (let i = 0; i <= n; i++) g.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1); },
    ell: (cx, cy, rx, ry, col) => { g.fillStyle = col; for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
      if ((x * x) / (rx * rx + .5) + (y * y) / (ry * ry + .5) <= 1) g.fillRect(cx + x, cy + y, 1, 1); },
  };
  draw(P); return c;
}
function sprite(img, x, y, flip = false, alpha = 1) {
  ctx.imageSmoothingEnabled = false;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  if (flip) { ctx.save(); ctx.translate(Math.round(x) + img.width, Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); }
  else ctx.drawImage(img, Math.round(x), Math.round(y));
  if (alpha !== 1) ctx.globalAlpha = 1;
}

/* ---------- интерфейс: кнопки, бумага, табличка ---------- */
const BTN_COL = { primary: ['#f2c94c', '#b08a1e', '#2b2a33', '#fbe39a'], alt: ['#7fc4a8', '#3f8a6e', '#2b2a33', '#b9e6d3'],
  off: ['#5a5766', '#3a3846', '#c3c0cf', '#6c6978'], danger: ['#e98f6f', '#a8553c', '#2b2a33', '#f6c0ab'], dark: ['#3a3946', '#24232c', '#f4f3ee', '#4b4a57'] };
/* кнопка: рисуется и сразу проверяет щелчок; возвращает true, если нажата */
function button(label, cx, y, kind = 'primary', o = {}) {
  const C = BTN_COL[kind]; const w = Math.round((o.w || textW(label) + 12)), h = 16;
  let x = Math.round(o.left !== undefined ? o.left : clamp(cx - w / 2, 4, W - 4 - w));
  const hov = !isTouch && pointer.x >= x && pointer.x < x + w && pointer.y >= y && pointer.y < y + h;
  const sel = o.selected;
  rect(x + 1, y, w - 2, h, '#1b1a21'); rect(x, y + 1, w, h - 2, '#1b1a21');
  rect(x + 1, y + 1, w - 2, h - 2, C[1]); rect(x + 1, y + 1, w - 2, h - 5, (hov || sel) ? C[3] : C[0]); rect(x + 2, y + 1, w - 4, 1, C[3]);
  text(label, x + w / 2, y + 3, { col: C[2], align: 'center' });
  if (sel) { rect(x - 5, y + 5, 3, 5, '#f2c94c'); }
  return clickIn(x, y, w, h);
}
function paper(x, y, w, h, seed = 1) {
  const R = rng(w * 7 + h + seed);
  rect(x + 3, y + 3, w, h, 'rgba(10,10,14,.45)');
  rect(x, y, w, h, '#cfc3a5'); rect(x + 1, y + 1, w - 2, h - 2, '#efe8d6');
  ctx.fillStyle = '#e2d9c2'; for (let i = 0; i < w * h / 90; i++) ctx.fillRect(Math.round(x + 2 + R() * (w - 4)), Math.round(y + 2 + R() * (h - 4)), 1, 1);
  ctx.fillStyle = '#d4c8aa'; ctx.beginPath(); ctx.moveTo(x + w - 11, y + h - 1); ctx.lineTo(x + w - 1, y + h - 11); ctx.lineTo(x + w - 11, y + h - 11); ctx.fill();
  for (const tx of [x + 14, x + w - 42]) { rect(tx, y - 4, 28, 9, 'rgba(234,220,156,.85)'); rect(tx, y - 4, 1, 9, 'rgba(211,194,122,.9)'); rect(tx + 27, y - 4, 1, 9, 'rgba(211,194,122,.9)'); }
}
function plate(x, y, w, h) {
  rect(x + 3, y + 3, w, h, 'rgba(16,24,42,.5)');
  rect(x + 1, y, w - 2, h, '#e9eef5'); rect(x, y + 1, w, h - 2, '#e9eef5');
  rect(x + 3, y + 2, w - 6, h - 4, '#2f4f8a'); rect(x + 2, y + 3, w - 4, h - 6, '#2f4f8a');
  rect(x + 3, y + h - 6, w - 6, 3, '#284579');
  for (const [rx, ry] of [[x + 6, y + 6], [x + w - 8, y + 6], [x + 6, y + h - 8], [x + w - 8, y + h - 8]]) rect(rx, ry, 2, 2, '#9fb0cc');
}
// тёмная пиксельная рамка: панели меню, HUD, диалог
function frameBox(x, y, w, h, alpha = .9) {
  rect(x + 2, y + 2, w, h, 'rgba(5,6,10,.5)');
  rect(x, y, w, h, `rgba(14,17,28,${alpha})`);
  rect(x + 1, y, w - 2, 1, '#55607c'); rect(x + 1, y + h - 1, w - 2, 1, '#55607c'); rect(x, y + 1, 1, h - 2, '#55607c'); rect(x + w - 1, y + 1, 1, h - 2, '#55607c');
  rect(x + 2, y + 2, w - 4, 1, '#262c3d'); rect(x + 2, y + h - 3, w - 4, 1, '#0a0c12');
  for (const [cx, cy] of [[x + 2, y + 2], [x + w - 4, y + 2], [x + 2, y + h - 4], [x + w - 4, y + h - 4]]) rect(cx, cy, 2, 2, '#8792ad');
}
const INK = '#2b2a33', INK_RED = '#b8443f', INK_TEAL = '#2f8577', INK_MUTED = '#857d6c', INK_GOLD = '#a87b12';

/* ---------- уведомления E-KNOT (тосты) ---------- */
const toasts = [];
function toast(title, body, ms = 3800) { toasts.length = 0; toasts.push({ title, body, t: 0, ms }); beep(880, .05, 'sine', .03); beep(1320, .07, 'sine', .03, .06); }
function drawToasts(dt) {
  if (scene && scene.ballot) return;
  for (const T of toasts) {
    T.t += dt;
    const a = T.t < 150 ? T.t / 150 : T.t > T.ms - 300 ? Math.max(0, (T.ms - T.t) / 300) : 1;
    ctx.globalAlpha = a;
    const lines = wrapText(T.body, 290);
    const w = Math.max(textW(T.title) + 28, 150, ...lines.map(l => textW(l) + 16)) | 0, h = 18 + lines.length * 11 + 4;
    const x = Math.round((W - w) / 2), y = 22;
    rect(x + 2, y + 2, w, h, 'rgba(20,19,24,.35)');
    rect(x + 1, y, w - 2, h, '#1b1a21'); rect(x, y + 1, w, h - 2, '#1b1a21');
    rect(x + 1, y + 1, w - 2, h - 2, '#f4f3ee'); rect(x + 1, y + 1, w - 2, 13, '#2f8577');
    rect(x + 4, y + 3, 9, 9, '#f4f3ee'); rect(x + 6, y + 5, 1, 5, '#2f8577'); rect(x + 6, y + 5, 5, 1, '#2f8577'); rect(x + 6, y + 7, 4, 1, '#2f8577'); rect(x + 6, y + 9, 5, 1, '#2f8577');
    text(T.title, x + 17, y + 4);
    lines.forEach((l, i) => text(l, x + 8, y + 18 + i * 11, { col: INK }));
    ctx.globalAlpha = 1;
  }
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > toasts[i].ms) toasts.splice(i, 1);
}

/* ---------- звук (после первого касания) ---------- */
const SND = { ac: null, on: loadStr('d67_sound', '1') === '1' };
function audioUnlock() { if (!SND.ac) { try { SND.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(freq, dur = .04, type = 'square', vol = .04, delay = 0) {
  if (!SND.on || !SND.ac) return;
  try {
    const t0 = SND.ac.currentTime + delay, o = SND.ac.createOscillator(), g = SND.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(SND.ac.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) {}
}
const sfx = {
  knock: () => { beep(110, .07, 'triangle', .25); beep(95, .07, 'triangle', .25, .16); beep(100, .07, 'triangle', .22, .32); },
  door: () => { beep(220, .12, 'sawtooth', .03); beep(160, .15, 'sawtooth', .03, .1); },
  stamp: () => { beep(70, .12, 'square', .12); beep(523, .08, 'square', .04, .12); beep(784, .12, 'square', .04, .2); },
  no: () => { beep(200, .12, 'square', .05); beep(140, .18, 'square', .05, .12); },
  step: () => beep(60 + Math.random() * 20, .03, 'triangle', .04),
  select: () => beep(660, .03, 'square', .03),
  blip: (p) => beep(p, .025, 'square', .025),
};

/* ---------- переход «чёрный круг» ---------- */
const trans = { phase: null, t: 0, x: W / 2, y: H / 2, cb: null };
function irisTo(x, y, cb) { if (trans.phase) return; Object.assign(trans, { phase: 'out', t: 0, x, y, cb }); }
function irisFrom(x, y) { Object.assign(trans, { phase: 'in', t: 0, x, y, cb: null }); }
function drawIris(dt) {
  if (!trans.phase) return;
  trans.t += dt; const D = 320, R = Math.hypot(W, H) + 10;
  const k = Math.min(1, trans.t / D);
  ctx.fillStyle = '#0b0c10';
  if (trans.phase === 'out') {
    const r = Math.ceil(R * k * k / 6) * 6; ctx.beginPath(); ctx.arc(trans.x, trans.y, r, 0, Math.PI * 2); ctx.fill();
    if (k >= 1) { const cb = trans.cb; trans.phase = 'hold'; trans.t = 0; cb && cb(); }
  } else if (trans.phase === 'hold') { ctx.fillRect(0, 0, W, H); }
  else {
    const r = Math.max(0, Math.ceil(R * (1 - (1 - k) * (1 - k)) / 6) * 6);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(trans.x, trans.y, r, 0, Math.PI * 2, true); ctx.fill('evenodd');
    if (k >= 1) trans.phase = null;
  }
}

const scenes = {}; let scene = null;
function go(name, data, from) {
  scene = scenes[name]; clicks = []; for (const k in pressed) pressed[k] = false;
  scene.enter && scene.enter(data || {});

  irisFrom(p.x, p.y);
}
let last = performance.now();
function frame(now) {
  const dt = clamp(now - last, 0, 50); last = now;
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  if (scene) { scene.update && scene.update(dt); scene.draw && scene.draw(dt); }
  drawToasts(dt);

/* ============================================================

   Пока настоящего бэкенда нет, запросы обслуживает заглушка MockServer:
   она ведёт себя как сервер (задержка, редкие ошибки сети, проверка
   результатов), а данные хранит в localStorage браузера.
   Когда появится сервер — в API_CONFIG.baseUrl ставится его адрес,
   и все те же запросы пойдут через fetch. Игру менять не нужно.
   Описание запросов: docs/API.md
   ============================================================ */
const API_CONFIG = {
  baseUrl: null,                 // например 'https://api.e-knot.kz/game/v1'
  latency: [150, 450],           // задержка ответа заглушки, мс
  failRate: .04,                 // доля «обрывов связи» в заглушке (?stable — без них)
};

/* ---------------- заглушка сервера ---------------- */
const MockServer = (() => {
  const DB_KEY = 'kn_server_db';
  const load = () => { try { return JSON.parse(loadStr(DB_KEY, '')) || null; } catch (e) { return null; } };
  const db = load() || { users: {}, profiles: {}, runs: {}, scores: {}, rewards: {} };
  const commit = () => saveStr(DB_KEY, JSON.stringify(db));

  // тестовые жители: так приложение E-KNOT передало бы токен в ссылке (?token=demo)
  const TOKENS = {
    demo:  { userId: 'u-1001', name: 'Әмина', complex: { id: 'c-17', name: 'ЖК «Нұрлы»', city: 'Астана' }, apartment: 13 },
    demo2: { userId: 'u-1002', name: 'Арман', complex: { id: 'c-17', name: 'ЖК «Нұрлы»', city: 'Астана' }, apartment: 7 },
  };
  // соседи и горожане для таблицы рекордов (как будто уже играли)
  const FAKE = [
    ['Динара', 'c-17', 1460], ['Ерлан', 'c-17', 1310], ['Роза апа', 'c-17', 980], ['Тимур', 'c-17', 870], ['Әсел', 'c-17', 640],
    ['Нұрлан', 'c-04', 1720], ['Ольга', 'c-04', 1180], ['Бақыт', 'c-09', 1590], ['Мадина', 'c-09', 1240], ['Асхат', 'c-21', 1390], ['Жанар', 'c-21', 760],
  ];
  const err = (status, code) => { const e = new Error(code); e.status = status; e.code = code; throw e; };
  const me = token => {
    if (!token) err(401, 'no_session');
    const u = db.users[token]; if (!u) err(401, 'bad_session'); return u;
  };

  const routes = {
    // вход: токен из приложения или гость (без бонусов)
    'POST /auth'({ body }) {
      const t = body.token && TOKENS[body.token];
      let user;
      if (t) user = { ...t, guest: false };
      else {
        const gid = body.deviceId || ('g-' + Math.floor(Math.random() * 1e9));
        user = { userId: gid, name: null, complex: { id: 'guest', name: null, city: 'Астана' }, apartment: null, guest: true };
      }
      const session = 's-' + user.userId;
      db.users[session] = user; db.profiles[user.userId] = db.profiles[user.userId] || null; commit();
      return { session, user };
    },
    'GET /profile'({ session }) { const u = me(session); return { profile: db.profiles[u.userId] }; },
    'PUT /profile'({ session, body }) {
      const u = me(session); const p = body.profile || {};
      // сервер не даёт игре самой себе начислить монеты: их меняет только итог тура
      const old = db.profiles[u.userId] || {};
      db.profiles[u.userId] = { ...p, coins: old.coins || 0, rewardsTotal: old.rewardsTotal || 0 }; commit();
      return { ok: true };
    },
    'DELETE /profile'({ session }) {
      const u = me(session); db.profiles[u.userId] = null; delete db.scores[u.userId]; db.rewards[u.userId] = []; commit(); return { ok: true };
    },
    'POST /tours/start'({ session, body }) {
      const u = me(session); const tour = TOURS[body.tourId]; if (!tour) err(404, 'no_tour');

/* ---------------- клиент: одна функция для заглушки и для настоящего сервера ---------------- */
const NET = { pending: 0, lastError: null };
async function request(method, path, { body, query } = {}, tries = 3) {
  NET.pending++;
  try {
    for (let i = 0; ; i++) {
      try {
        if (!API_CONFIG.baseUrl) return await MockServer.handle(method, path, { session: API.session, body, query });
        const qs = query ? '?' + new URLSearchParams(query) : '';
        const res = await fetch(API_CONFIG.baseUrl + path + qs, {
          method, headers: { 'Content-Type': 'application/json', ...(API.session ? { Authorization: 'Bearer ' + API.session } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) { const e = new Error('http_' + res.status); e.status = res.status; throw e; }
        return await res.json();
      } catch (e) {
        // сеть мигнула — повторяем с паузой; ошибки вроде 401/404 не повторяем
        if (e.status || i >= tries - 1) { NET.lastError = e; throw e; }
        await wait(400 * (i + 1));
      }
    }
  } finally { NET.pending--; }
}

function shade(hex, amt) {

/* ============================================================
   НОЧНОЙ ГОРОД — меню и итоги. По референсу автора:
   панельная высотка снизу в три четверти, горящая вывеска,
   за ней город, рядом соседние дома, на переднем плане крыша.
   Слои: небо → звёзды → город и дома → окна → вывеска → передний план → снег
   ============================================================ */
function fillPoly(g, pts, col) {
  g.fillStyle = col;
  const ys = pts.map(p => p[1]), y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
  for (let y = y0; y < y1; y++) {
    const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2) { const xa = Math.round(xs[i]), xb = Math.round(xs[i + 1]); if (xb > xa) g.fillRect(xa, y, xb - xa, 1); }
  }
}
const lerp2 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];

// главная высотка: фасад (справа, широкий) и торец (слева, узкий, в тени)
const BLD = { TL: [198, 80], TR: [384, 93], BL: [186, 240], BR: [404, 240], STL: [158, 96], SBL: [142, 240], rows: 17, cols: 16 };
const persp = v => Math.pow(v, 1.2);           // снизу этажи ближе — выше
function FF(u, v) { const T = lerp2(BLD.TL, BLD.TR, u), B = lerp2(BLD.BL, BLD.BR, u); return lerp2(T, B, persp(v)); }
function SF(u, v) { const T = lerp2(BLD.STL, BLD.TL, u), B = lerp2(BLD.SBL, BLD.BL, u); return lerp2(T, B, persp(v)); }

const NIGHT = { lang: null, t: 0, next: 0, windows: [], stars: [], snow: [], blinkers: [] };
function signText() { return LANG === 'kz' ? 'БӘРІ ЖАҚСЫ БОЛАДЫ!' : 'ВСЁ БУДЕТ ХОРОШО!'; }

function buildNight() {
  const R = rng(7);
  NIGHT.windows = []; NIGHT.blinkers = [];
  const win = (x, y, w, h, o = {}) => NIGHT.windows.push(Object.assign({ x: Math.round(x), y: Math.round(y), w: Math.max(2, Math.round(w)), h: Math.max(2, Math.round(h)),
    on: R() < .2, tv: R() < .02, warm: pick(R, ['#f2c66a', '#f7e3a1', '#e8a85a', '#f2c66a']), off: pick(R, ['#1c2233', '#20273a', '#252c40']) }, o));

  // ---- небо ----
  NIGHT.sky = makeCanvas(W, H, ({ r }) => {
    for (let y = 0; y < H; y++) { const k = y / H; r(0, y, W, 1, `rgb(${13 + k * 22 | 0},${22 + k * 30 | 0},${44 + k * 40 | 0})`); }
    // зарево города у горизонта
    for (let y = 120; y < H; y++) { const k = (y - 120) / (H - 120); r(0, y, W, 1, `rgba(214,120,84,${(k * k * .28).toFixed(3)})`); }
  });

  // ---- город, соседние дома, главная высотка ----
  NIGHT.mid = makeCanvas(W, H, ({ r, p, line, g }) => {
    // дальний город: ряды силуэтов с редкими огнями
    for (const [base, col, hMin, hMax, dens] of [[196, '#1b2338', 10, 36, .05], [204, '#151c2e', 14, 48, .08]]) {

        for (let yy = base - h + 3; yy < base + 10; yy += 3) for (let xx = x + 2; xx < x + w - 1; xx += 3) if (R() < dens) p(xx, yy, pick(R, ['#d9b46a', '#e8c88a', '#9fb0cc']));
        if (h > hMax - 8 && R() < .6) NIGHT.blinkers.push({ x: x + (w >> 1), y: base - h - 1, ph: R() * 6 });

    }

    NIGHT.blinkers.push({ x: 128, y: 95, ph: 1 });
    for (let yy = 108; yy < 210; yy += 5) for (let xx = 119; xx < 140; xx += 4) if (R() < .18) r(xx, yy, 2, 2, '#c9a65e');
    // соседний дом слева (девятиэтажка, прямо)
    const nx = -6, nw = 98, ny = 124;
    r(nx, ny, nw, H - ny, '#2a3248'); r(nx, ny - 3, nw + 2, 3, '#20273a'); r(nx, ny - 3, nw + 2, 1, '#3a4460');
    r(40, ny - 14, 1, 11, '#141a28'); r(36, ny - 12, 9, 1, '#141a28'); r(38, ny - 9, 5, 1, '#141a28');
    for (let row = 0; row < 9; row++) {
      const y = ny + 5 + row * 11; r(nx, y + 8, nw, 1, '#38415a');
      for (let c = 0; c < 7; c++) { if (c === 3) { win(nx + 6 + c * 13 + 2, y + 3, 3, 4, { on: R() < .6, warm: '#b8c9a8' }); continue; } win(nx + 6 + c * 13, y + 1, 7, 6); }
    }

    const { TL, TR, BL, BR, STL, SBL, rows, cols } = BLD;
    fillPoly(g, [STL, TL, BL, SBL], '#2b3247');                         // торец
    fillPoly(g, [TL, TR, BR, BL], '#58627d');                            // фасад
    // фасад темнеет кверху (дальше от фонарей двора)
    g.save(); g.beginPath(); g.moveTo(TL[0], TL[1]); g.lineTo(TR[0], TR[1]); g.lineTo(BR[0], BR[1]); g.lineTo(BL[0], BL[1]); g.closePath(); g.clip();
    for (let y = TL[1] - 2; y < 170; y += 2) { const k = 1 - (y - TL[1]) / (170 - TL[1]); g.fillStyle = `rgba(14,18,32,${(Math.max(0, k) * .4).toFixed(3)})`; g.fillRect(0, y, W, 2); }
    g.restore();
    // вертикальные швы панелей и колонна лестничной клетки
    for (let c = 2; c < cols; c += 2) { const a = FF(c / cols, 0), b = FF(c / cols, 1); line(a[0], a[1], b[0], b[1], '#4c5570'); }
    const sc0 = 7 / cols, sc1 = 8 / cols;
    fillPoly(g, [FF(sc0, 0), FF(sc1, 0), FF(sc1, 1), FF(sc0, 1)], '#4b5470');
    // этажи: плиты балконов (светлые полосы) и окна
    for (let row = 0; row < rows; row++) {
      const vb = (row + .86) / rows, a = FF(0, vb), b = FF(1, vb);
      line(a[0], a[1], b[0], b[1], '#8792ad'); line(a[0], a[1] + 1, b[0], b[1] + 1, '#3a4258');
      const sa = SF(0, vb), sb = SF(1, vb); line(sa[0], sa[1], sb[0], sb[1], '#3a4360');
      for (let c = 0; c < cols; c++) {
        if (c === 7) { const p0 = FF((c + .3) / cols, (row + .4) / rows), p1 = FF((c + .7) / cols, (row + .62) / rows);
          win(p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1], { on: R() < .7, warm: '#c4d6b4', off: '#232a3c' }); continue; }
        const ctr = FF((c + .5) / cols, (row + .2) / rows), bot = FF((c + .5) / cols, (row + .7) / rows), cw = FF((c + 1) / cols, (row + .5) / rows)[0] - FF(c / cols, (row + .5) / rows)[0];
        const ww = Math.round(cw * .66), hh = Math.max(3, Math.round(bot[1] - ctr[1]));
        win(Math.round(ctr[0] - ww / 2), Math.round(ctr[1]), ww, hh, { front: true });
      }
      for (let c = 0; c < 3; c++) { const p0 = SF((c + .3) / 3, (row + .26) / rows), p1 = SF((c + .62) / 3, (row + .66) / rows);
        win(p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1], { on: R() < .14, off: '#1a2030' }); }
    }
    // угол дома — светлое ребро; парапет и надстройки на крыше
    line(TL[0], TL[1], BL[0], BL[1], '#6d7893');
    fillPoly(g, [[STL[0] - 1, STL[1] - 3], [TL[0], TL[1] - 3], [TL[0], TL[1]], [STL[0] - 1, STL[1]]], '#252c40');
    fillPoly(g, [[TL[0], TL[1] - 3], [TR[0] + 1, TR[1] - 3], [TR[0] + 1, TR[1]], [TL[0], TL[1]]], '#3b4460');
    line(TL[0], TL[1] - 3, TR[0] + 1, TR[1] - 3, '#5d6884');
    // стойки вывески
    for (const u of [.2, .5, .8]) { const q = FF(u, 0); r(q[0], q[1] - 9, 1, 7, '#1a1e2a'); }
  });

  // ---- передний план: крыша, на которой «стоит» зритель, и угол дома справа ----
  NIGHT.fg = makeCanvas(W, H, ({ r, p, line, g }) => {
    fillPoly(g, [[0, 205], [206, 212], [206, H], [0, H]], '#0a0d14');
    line(0, 205, 206, 212, '#1f2533');
    r(46, 176, 1, 30, '#141925'); r(38, 180, 17, 1, '#141925'); r(41, 185, 11, 1, '#141925'); r(43, 190, 7, 1, '#141925');
    r(150, 196, 6, 13, '#11151f'); r(149, 195, 8, 2, '#1a2030');
    fillPoly(g, [[368, 128], [400, 120], [400, H], [362, H]], '#0c0f17');
    line(368, 128, 400, 120, '#1b2130');
  });
  // окна дома на переднем плане
  for (const [x, y, on] of [[376, 146, true], [388, 143, false], [376, 172, false], [388, 170, true], [376, 198, true]])
    win(x, y, 7, 10, { on, tv: false, fg: true, warm: '#e8a85a' });

  NIGHT.stars = Array.from({ length: 90 }, () => ({ x: R() * W, y: R() * 130, ph: R() * 6, big: R() < .12 }));
  NIGHT.snow = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, v: .006 + R() * .014, dx: (R() - .5) * .012, big: R() < .2 }));

  // ---- вывеска: доска, буквы и свечение (с наклоном крыши) ----
  const s = signText(); font(8);
  const tw = Math.ceil(textW(s, 8)), sw = tw + 10, sh = 13;
  const mid = FF(.5, 0), a0 = FF(0, 0), b0 = FF(1, 0), slope = (b0[1] - a0[1]) / (b0[0] - a0[0]);
  const a = [mid[0] - sw / 2, mid[1] - sw / 2 * slope];
  const board = makeCanvas(sw, sh, ({ r }) => { r(0, 0, sw, sh, '#120a0c'); r(0, 0, sw, 1, '#2a1416'); r(0, sh - 1, sw, 1, '#07040a'); });
  const letters0 = on => makeCanvas(sw, sh, ({ g }) => {
    g.font = '8px ' + FONT; g.textBaseline = 'top'; g.fillStyle = on ? '#ff6a45' : '#3c1714'; g.fillText(s, 5, 3);
    if (on) { g.fillStyle = 'rgba(255,214,190,.55)'; g.globalCompositeOperation = 'source-atop'; g.fillRect(0, 5, sw, 2); g.globalCompositeOperation = 'source-over'; }
  });

  // доска наклонена по столбцам, а каждая буква сдвинута целиком — так текст остаётся чётким
  const shear = on => { const src = letters0(on); return makeCanvas(sw, sh + Math.ceil(sw * Math.abs(slope)) + 1, ({ g }) => {
    for (let x = 0; x < sw; x++) g.drawImage(board, x, 0, 1, sh, x, Math.round(x * slope), 1, sh);
    for (const [lx, lw] of lw0) { const dy = Math.round((lx + lw / 2) * slope); g.drawImage(src, lx, 0, lw, sh, lx, dy, lw, sh); }
  }); };
  const on = shear(true), off = shear(false);

  // где какая буква (для мерцания)
  const letters = lw0.filter((_, i) => s[i] !== ' ');
  NIGHT.sign = { on, off, glow, x: Math.round(a[0]), y: Math.round(a[1]) - 22, letters, flick: -1, until: 0 };
  NIGHT.lang = LANG;
}

function drawNight(dt) {
  if (NIGHT.lang !== LANG) buildNight();
  NIGHT.t += dt; const t = NIGHT.t;
  sprite(NIGHT.sky, 0, 0);
  for (const s of NIGHT.stars) { ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 900 + s.ph)); rect(s.x, s.y, s.big ? 2 : 1, s.big ? 2 : 1, '#dfe6f2'); }
  ctx.globalAlpha = 1;
  const px = (t / 24) % (W + 240) - 120;
  if (px > 0 && px < W) { const py = 30 + px * .04; rect(px, py, 3, 1, '#7f8fb0'); if (Math.floor(t / 450) % 2) rect(px + 3, py, 1, 1, '#ff5a4a'); }
  sprite(NIGHT.mid, 0, 0);
  for (const b of NIGHT.blinkers) if (Math.sin(t / 380 + b.ph) > .3) rect(b.x, b.y, 1, 1, '#ff4a3a');
  // свет в окнах то гаснет, то загорается
  if (t > NIGHT.next) {
    NIGHT.next = t + 120 + Math.random() * 520;
    const w = NIGHT.windows[Math.floor(Math.random() * NIGHT.windows.length)]; if (!w.fg) w.on = !w.on;
  }
  const S = NIGHT.sign;
  const drawWin = w => {
    if (w.tv) { const f = Math.sin(t / 80 + w.x * 3) > .2; rect(w.x, w.y, w.w, w.h, f ? '#86a6dc' : '#4f6aa8'); return; }
    rect(w.x, w.y, w.w, w.h, w.on ? w.warm : w.off);
    if (w.on && w.h > 3) { rect(w.x, w.y + w.h - 1, w.w, 1, shade(w.warm, -45)); if (w.front && w.w > 4) rect(w.x + (w.w >> 1), w.y, 1, w.h - 1, shade(w.warm, -30)); }
  };
  for (const w of NIGHT.windows) if (!w.fg) drawWin(w);
  // вывеска: горит целиком, изредка одна буква подмигивает
  if (t > S.until) { S.flick = Math.random() < .5 ? Math.floor(Math.random() * S.letters.length) : -1; S.until = t + (S.flick >= 0 ? 160 + Math.random() * 380 : 900 + Math.random() * 2400); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55 + .08 * Math.sin(t / 140); ctx.drawImage(S.glow, S.x - 12, S.y - 12); ctx.restore();
  ctx.drawImage(S.on, S.x, S.y);
  if (S.flick >= 0 && Math.floor(t / 60) % 3) { const [lx, lw] = S.letters[S.flick]; ctx.drawImage(S.off, lx, 0, lw, S.off.height, S.x + lx, S.y, lw, S.off.height); }
  sprite(NIGHT.fg, 0, 0);
  for (const w of NIGHT.windows) if (w.fg) drawWin(w);
  for (const s of NIGHT.snow) { s.y += s.v * dt; s.x += s.dx * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } rect(s.x, s.y, s.big ? 2 : 1, s.big ? 2 : 1, 'rgba(230,236,245,.7)'); }
}

/* ============================================================
   ДВОР У ПОДЪЕЗДА — пролог. Низ той же панельки, козырёк,
   фонарь, лавочка, машина под снегом, соседние дома
   ============================================================ */
const STREET = { built: false, windows: [], snow: [] };
const STREET_DOOR_X = 214, STREET_UP = 62, STREET_GROUND = 196 - STREET_UP;
function buildStreet() {
  const R = rng(19); STREET.windows = [];
  STREET.bg = makeCanvas(W, H + STREET_UP, ({ r, p, line, g }) => {
    for (let y = 0; y < H; y++) { const k = y / H; r(0, y, W, 1, `rgb(${13 + k * 22 | 0},${22 + k * 30 | 0},${44 + k * 40 | 0})`); }
    for (let i = 0; i < 40; i++) p(R() * W, R() * 90, '#9fb0cc');

  if (!DLG.open || !DLG.resolve) return;
  if (DLG.choices) {
    const n = DLG.choices.length;
    if (hit('right')) { DLG.cursor = (DLG.cursor + 1) % n; sfx.select(); }
    if (hit('left')) { DLG.cursor = (DLG.cursor + n - 1) % n; sfx.select(); }
    if (hit('down')) { DLG.cursor = (DLG.cursor + 2) % n; sfx.select(); }
    if (hit('up')) { DLG.cursor = (DLG.cursor + n - 2) % n; sfx.select(); }
    for (let i = 0; i < n; i++) {
      const x = CH.x0 + (i % 2) * CH.colW, y = CH.y0 + Math.floor(i / 2) * CH.rowH;
      if (clickIn(x - 1, y - 1, CH.bw + 2, CH.bh + 2)) { DLG.cursor = i; return choose(); }
    }
    if (hit('act')) return choose();
    return;
  }
  const len = DLG.text.length;
  if (DLG.shown < len) {
    DLG.shown = Math.min(len, DLG.shown + dt * .06);
    DLG.blipAt -= dt; if (DLG.blipAt <= 0) { sfx.blip(DLG.voice + Math.random() * 40); DLG.blipAt = 55; }
  }
  if (hit('act') || clickIn(6, DLG_BOX.y, W - 12, DLG_BOX.h)) {
    if (DLG.shown < len) DLG.shown = len; else { const r = DLG.resolve; DLG.resolve = null; r(); }
  }
  function choose() { const r = DLG.resolve, c = DLG.cursor; DLG.resolve = null; DLG.choices = null; sfx.select(); r(c); }
}
function dlgDraw() {
  if (!DLG.open) return;
  const x = 6, y = DLG_BOX.y, w = W - 12, h = DLG_BOX.h;
  rect(x, y, w, h, '#f4f3ee'); rect(x + 2, y + 2, w - 4, h - 4, '#0b0c10');

  rect(x + 7, y + 8, 44, 44, '#f4f3ee'); rect(x + 8, y + 9, 42, 42, '#20222b');
  if (DLG.port) sprite(DLG.port(DLG.expr), x + 9, y + 10);

  else { const parts = DLG.name.split(' '); parts.slice(0, 2).forEach((s, i) => text(s.slice(0, 9), x + 29, y + 55 + i * 9, { align: 'center', col: '#f2c94c', size: 6 })); }

  if (DLG.choices) {

      rect(cx, cy, CH.bw, CH.bh, sel ? '#f2c94c' : '#1d2130'); rect(cx, cy + CH.bh - 2, CH.bw, 2, sel ? '#b8902a' : '#11141d');

    });
  }
  // настрой жильца
  if (DLG.mood) {

/* ============================================================
   СЦЕНА: ТУР — обход подъезда
   ============================================================ */
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeResidents(tour, seed) {
  const R = rng(seed), pool = tour.mix.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  // раскладываем по этажам так, чтобы на одном этаже не было двух одинаковых жильцов,
  // а одинаковые типы не скапливались на соседних этажах
  const apts = []; for (let apt = 1; apt <= tour.floors * tour.perFloor; apt++) if (apt !== tour.heroApt) apts.push(apt);
  const fl = apt => Math.ceil(apt / tour.perFloor);
  let mix = null, bestCost = 1e9;
  for (let attempt = 0; attempt < 40 && bestCost > 0; attempt++) {
    const left = pool.slice(), order = apts.slice().sort(() => R() - .5), put = {}, onFloor = {};
    for (const apt of order) {
      const f = fl(apt), here = onFloor[f] || (onFloor[f] = []), near = [...(onFloor[f - 1] || []), ...(onFloor[f + 1] || [])];
      const score = a => (here.includes(a) ? 10 : 0) + (near.includes(a) ? 1 : 0) + R() * .5;
      let best = 0; for (let i = 1; i < left.length; i++) if (score(left[i]) < score(left[best])) best = i;
      put[apt] = left.splice(best, 1)[0]; here.push(put[apt]);
    }
    let cost = 0; for (const f in onFloor) cost += onFloor[f].length - new Set(onFloor[f]).size;
    if (cost < bestCost) { bestCost = cost; mix = apts.map(a => put[a]); }
  }
  const seen = {}, vOff = Math.floor(R() * 4);
  const res = {}; let k = 0; const used = new Set();
  for (let apt = 1; apt <= tour.floors * tour.perFloor; apt++) {
    if (apt === tour.heroApt) continue;
    const a = mix[k++], A = ARCH[a];
    let name = pick(R, NAMES[a]); let tries = 0; while (used.has(name) && tries++ < 5) name = pick(R, NAMES[a]); used.add(name);
    const look = Object.assign({}, A.look);
    if (a !== 'apa') look.skin = pick(R, ['#f1c7a3', '#e3ad86', '#d9a77c', '#c98e66']);
    if (!['apa', 'grump'].includes(a)) look.topCol = pick(R, ['#3f6f8c', '#b8443f', '#c79a3b', '#5d6b5a', '#7d4f8a', '#2f8577', '#9aa0a5']);
    if (a === 'mom' || a === 'renter') look.hair = pick(R, ['bun', 'long']);
    if (a === 'apa') look.scarfCol = pick(R, ['#c8414a', '#3f6f8c', '#4f7a4a', '#7d4f8a']);
    const away = !A.renter && a !== 'apa' && !A.sleeper && R() < tour.awayShare;
    const trust = (SAVE.trust && SAVE.trust[apt]) || 0;
    res[apt] = { apt, arch: a, A, name, look, mood: A.mood + trust + Math.round((R() - .5) * 8), status: A.renter ? 'unknown' : 'unknown',
      away, returnAt: tour.start + 8 + Math.floor(R() * 34) + (R() < .2 ? 999 : 0), knocks: 0, listened: false, v: (seen[a] = (seen[a] || 0) + 1) + vOff, last: {}, sleeping: !!A.sleeper, door: 0, met: false,
      floor: Math.ceil(apt / tour.perFloor), d: (apt - 1) % tour.perFloor };
  }
  return res;
}

  update(dt) {
    if (this.over) return;

    const h = this.hero, T = this.tour;
    // время идёт, пока игрок ходит (в диалоге и в бюллетене — пауза)
    if (!this.busy && !this.ballot && !trans.phase) this.minute += dt / 1000 / T.secPerMin;
    if (this.minute >= this.end && !this.busy) { this.finish(true); return; }

    if (this.helper.state === 'hidden' && this.signatures() >= T.helperAfter) this.helper.state = 'shown';
    // крысы
    this.updateRats(dt);
    if (this.racAnim) { this.racAnim.t += dt; if (this.racAnim.t > 1800) this.racAnim = null; }

      const a = pts[seg], b = pts[seg + 1];
      h.x = lerp(a[0], b[0], Math.min(1, k)); h.y = lerp(a[1], b[1], Math.min(1, k)); h.dir = b[0] < a[0] ? -1 : 1; h.walkT += dt;
      this.stepAcc += dt; if (this.stepAcc > 260) { this.stepAcc = 0; sfx.step(); }
      if (c.t >= 1) { h.floor = c.to; h.x = pts[2][0]; h.y = this.base(c.to); h.climb = null; this.addTime(.5); }
      this.updateCam(dt); return;
    }
    let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir || keys.up || keys.down) this.plan = null;          // клавиши отменяют маршрут
    if (!dir && this.plan) {

        const sx = STAIR_X - 6;

        else { this.startClimb(Math.sign(P.floor - h.floor)); this.updateCam(dt); return; }
      } else if (Math.abs(h.x - P.x) > 1.5) dir = Math.sign(P.x - h.x);

        if (P.door) { if (P.door === T.heroApt) toast('E-KNOT', L(UI.yourDoor), 2400); else this.visit(this.res[P.door]); this.updateCam(dt); return; }

      if (dir && Math.abs((P.floor !== h.floor ? STAIR_X - 6 : P.x) - h.x) < dt * .075) { h.x = P.floor !== h.floor ? STAIR_X - 6 : P.x; dir = 0; }

  updateCam(dt) {

  startClimb(d) {

  onTap(x, wy) {
    const T = this.tour; let f = 1;
    for (let k = 1; k <= T.floors; k++) { const b = this.base(k); if (wy > b - FLOOR_H + 6 && wy <= b + 8) f = k; }
    if (wy < this.base(T.floors) - FLOOR_H + 6) f = T.floors;

  walkTo(x) { const h = this.hero; return new Promise(res => { h.goal = x; h.arrive = res; }); },
  /* ---- крысы: бегают по первому этажу, при виде героя прячутся в норы ---- */
  updateRats(dt) {

      else if (r.st === 'hidden') { if (near) r.k = 0; else if (r.k > 2200 + Math.random() * 800) { r.st = 'out'; r.k = 0; r.dir = Math.random() < .5 ? -1 : 1; } }
      else if (r.st === 'out') { if (r.k > 320) { r.st = 'roam'; r.k = 0; r.x = r.hole + r.dir * 9; } }

  drawRats(cy, t) {
    const b = this.base(1) - cy;
    for (const r of this.rats) {
      const fr = RAT[r.st === 'flee' ? Math.floor(r.t / 60) % 2 : r.st === 'roam' && r.pause <= 0 ? Math.floor(r.t / 120) % 2 : 0];
      if (r.st === 'hidden') { if (Math.floor(t / 1700 + r.x) % 3 === 0 && (t % 1700) < 1200) { rect(r.hole - 2, b - 5, 1, 1, '#e8d36a'); rect(r.hole + 1, b - 5, 1, 1, '#e8d36a'); } continue; }

  /* ---- стук в дверь и разговор ---- */

    const side = h.x <= DOOR_X[r.d] ? -1 : 1; await this.walkTo(DOOR_X[r.d] + side * 23); h.dir = -side;
    h.knockT = 700; sfx.knock(); this.addTime(.5); pop(DOOR_X[r.d], this.base(r.floor) - 30, LANG === 'kz' ? 'тық-тық' : 'тук-тук', '#c9cdc8');
    await wait(750);
    const m = this.minute, A = r.A;
    if (r.status === 'online') { pop(DOOR_X[r.d], this.base(r.floor) - 70, L(UI.st.online), '#9fd9c2'); this.busy = false; return; }
    const away = r.away && m < r.returnAt;
    if (away) { r.status = r.status === 'unknown' ? 'away' : r.status; r.knocks++; pop(DOOR_X[r.d], this.base(r.floor) - 70, '...', '#9fb0cc'); toast('E-KNOT', L(UI.nobody), 2400); this.busy = false; return; }

    if (r.sleeping) { r.mood -= 8; r.sleeping = false; }
    r.away = false; this.addTime(.5);
    dlgOpen(r.name, e => portrait(r.look, e), A.voice, A.renter ? null : () => r.mood);
    // у каждого жильца свой вариант приветствия/истории/ответа; реакции чередуются без повторов подряд
    const Ln = k => { const v = A.lines[k] || GENERIC[k]; if (!Array.isArray(v)) return L(v);
      if (['good', 'meh', 'bad'].includes(k)) { let i; do i = Math.floor(Math.random() * v.length); while (v.length > 1 && i === r.last[k]); r.last[k] = i; return L(v[i]); }
      let line = v[r.v % v.length]; const top = Math.ceil(r.apt / this.tour.perFloor) === this.tour.floors;
      if (top && line.top) line = line.top; else if (!top && line.low) line = line.low;
      return L(line); };
    if (A.renter) { await say(Ln('greet')); r.status = 'renter'; return this.endVisit(r); }
    if (r.status === 'yes') { await say(L(GENERIC.already), 'happy'); return this.endVisit(r); }
    if (r.status === 'no') { await say(L(GENERIC.againNo), 'angry'); return this.endVisit(r); }
    if (r.status === 'thinking') { r.mood += 4; await say(Ln('again')); } else await say(Ln('greet'), r.mood < 30 ? 'angry' : 'neutral');
    const hero = e => portrait(SAVE.look, e);
    for (let round = 0; round < 3; round++) {
      const menu = [{ label: L(UI.cExplain), k: 'explain' }, { label: L(UI.aFacts), k: 'facts' }, { label: L(UI.aBenefit), k: 'benefit' }, { label: L(UI.aNeighbors), k: 'neighbors' },
        { label: L(UI.aOnline), k: 'online' }, { label: L(UI.cListen), k: 'listen', dim: r.listened }, { label: L(UI.cLater), k: 'later' }];
      const c = menu[await ask(menu)].k;
      if (c === 'later') { await say(L(GENERIC.bye)); if (r.status !== 'yes') r.status = 'thinking'; return this.endVisit(r); }
      // реплика героя
      const heroLine = { explain: UI.heroExplain, facts: UI.heroFacts, benefit: UI.heroBenefit, neighbors: UI.heroNeighbors, online: UI.heroOnline, listen: UI.heroListen }[c];
      const swap = DLG.port, swapName = DLG.name, swapMood = DLG.mood;
      DLG.port = hero; DLG.name = SAVE.name; DLG.voice = 420;
      await say(L(heroLine).replace('{n}', this.signatures()), 'happy');
      DLG.port = swap; DLG.name = swapName; DLG.voice = A.voice; DLG.mood = swapMood;
      if (c === 'online') {

        if (A.onlineOk) { r.status = 'online'; await say(Ln('online'), 'happy'); this.events.push({ t: 'online', apt: r.apt }); return this.endVisit(r); }

      } else {
        this.addTime(1);
        let d = A.likes[c] + Math.round((Math.random() - .5) * 6);

        r.mood += d;

      }
      r.mood = clamp(r.mood, 0, 100);
      if (r.mood >= 70) { r.status = 'yes'; await say(Ln('yes'), 'happy'); this.signed(r, 'door'); return this.endVisit(r); }
      if (r.mood <= 12) { r.status = 'no'; sfx.no(); await say(Ln('no'), 'angry'); this.events.push({ t: 'no', apt: r.apt }); return this.endVisit(r); }

  signed(r, via) {

    pop(DOOR_X[r.d], this.base(r.floor) - 70, '+1 ✓', '#4caf6e');
    this.stampT = 900;

  },
  async endVisit(r) { dlgClose(); sfx.door(); await tweenDoor(r, 0); this.busy = false; },

  /* ---- болтун на лестнице ---- */
  async runTalker() {
    this.busy = true; this.talker.done = true;
    const look = this.talker.look;
    dlgOpen(L(UI.talkerName), e => portrait(look, e), 230);
    await say(L(UI.talker1), 'happy');
    const c = await ask([{ label: L(UI.tListen) }, { label: L(UI.tLater) }, { label: L(UI.tChat) }]);
    const floorRes = Object.values(this.res).filter(r => r.floor === this.talker.floor);
    if (c === 0) { this.addTime(3); floorRes.forEach(r => r.mood += 10); await say(L(UI.talkerListen), 'happy'); }
    if (c === 1) { floorRes.forEach(r => r.mood -= 5); await say(L(UI.talkerLater), 'angry'); }

  /* ---- помощница-активистка ---- */
  async runHelper() {

    await say(L(UI.helper1).replace('{f}', f), 'happy');
    const c = await ask([{ label: L(UI.hYes) }, { label: L(UI.hNo) }]);
    if (c === 0) { await say(L(UI.helperOk), 'happy'); this.helper.state = 'busy'; this.helper.doneAt = this.minute + 8; }

  helperDone() {

      if (r.away && this.minute < r.returnAt) continue;
      r.mood += 22; if (r.mood >= 60) { r.status = 'yes'; this.events.push({ t: 'yes', apt: r.apt, via: 'helper' }); n++; } else r.status = 'thinking';
    }
    toast(L(UI.helperName), L(UI.helperDone).replace('{f}', f).replace('{n}', n));

  },
  /* ---- енот: рассылка в E-KNOT ---- */
  useRaccoon() {

    if (this.raccoon <= 0) { toast(L(UI.raccoon), L(UI.noRaccoon), 2400); return; }
    this.raccoon--; this.racAnim = { t: 0 }; beep(988, .06, 'square', .04); beep(1318, .1, 'square', .04, .08);
    let n = 0;
    // уведомление доходит до всех, но откликаются те, кто уже пользуется приложением и не против
    const R = rng(hashStr(USER.userId) + Math.floor(this.minute));
    for (const r of Object.values(this.res)) {
      if (!r.A.onlineOk) continue;
      const chance = { away: .75, noanswer: .75, thinking: r.mood >= 40 ? .6 : 0, unknown: .3 }[r.status] || 0;
      if (R() >= chance) continue;
      r.status = 'online'; this.events.push({ t: 'online', apt: r.apt, via: 'raccoon' }); n++;

  /* ---- конец тура ---- */
  async finish(timeUp) {

    for (const r of Object.values(this.res)) if (r.status === 'online') {
      if (Math.random() < (r.arch === 'night' ? .9 : .82)) { r.status = 'yes'; this.events.push({ t: 'yes', apt: r.apt, via: 'online' }); } else r.status = 'thinking';
    }

  },

  draw(dt) {

      rect(236, b - 94, 1, 6, '#0e1011'); rect(231, b - 88, 11, 4, '#1c1f24'); rect(233, b - 85, 7, 3, lampOn ? '#fff1b8' : '#4b4f4c');

        if (!this.glow) this.glow = makeCanvas(220, 94, ({ g }) => { const gr = g.createRadialGradient(110, 10, 2, 110, 44, 110); gr.addColorStop(0, 'rgba(255,214,140,.30)'); gr.addColorStop(.5, 'rgba(255,190,110,.10)'); gr.addColorStop(1, 'rgba(255,190,110,0)'); g.fillStyle = gr; g.fillRect(0, 0, 220, 94); });
        ctx.drawImage(this.glow, 126, b - 94);
        for (let i = 0; i < 6; i++) { const dx = Math.sin(t / 2200 + i * 2.1 + f) * 46, dy = ((t / 60 + i * 37 + f * 11) % 70); rect(236 + dx, b - 80 + dy, 1, 1, 'rgba(255,236,190,.5)'); }
        ctx.restore();
      }
      for (let d = 0; d < 4; d++) {
        const apt = (f - 1) * 4 + d + 1, x = DOOR_X[d], r = this.res[apt];
        if (apt === T.heroApt) { sprite(ICONS.me, x + 16, b - 40); continue; }
        if (!r) continue;
        const home = !(r.away && this.minute < r.returnAt);
        if (home && !r.sleeping && r.door === 0) { rect(x - 11, b - 2, 22, 1, '#f2d27a'); ctx.fillStyle = 'rgba(242,210,122,.25)'; ctx.fillRect(x - 13, b - 1, 26, 1); }
        if (r.door > 0) {
          // дверь открывается: тёплый свет из квартиры, жилец выходит на порог
          const ow = Math.round(26 * r.door);
          rect(x - 13, b - 48, 26, 48, '#2a2018'); ctx.fillStyle = 'rgba(242,198,106,.45)'; ctx.fillRect(x - 13, b - 48, 26, 48);
          sprite(personSprite(r.look, 'idle' + (Math.floor(t / 600) % 2)), x - 9 + (h.x < x ? -2 : 2) * r.door, b - PH, h.x < x);
          const dw = Math.max(3, 26 - ow); rect(x + 13 - dw, b - 48, dw, 48, this.doorLook[apt].col); rect(x + 13 - dw, b - 48, 1, 48, '#0e0f12');
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(242,198,106,.12)';
          ctx.beginPath(); ctx.moveTo(x - 13, b); ctx.lineTo(x + 13, b); ctx.lineTo(x + 34, b + 1); ctx.lineTo(x - 34, b + 1); ctx.fill();
          ctx.fillRect(x - 40, b - 2, 80, 2); ctx.restore();
        }
        const ic = ICONS[r.status]; if (ic) { rect(x + 15, b - 41, 11, 11, 'rgba(10,12,16,.55)'); sprite(ic, x + 16, b - 40); }
      }
    }
    // кот на окне 4-го этажа, крысы на 1-м
    if (T.floors >= 4) sprite(CAT, 30, this.base(4) - FLOOR_H + 22 - cy);
    this.drawRats(cy, t);
    // болтун
    const tk = this.talker;
    if (this.plan && !this.busy) { const P = this.plan, mx = P.x, my = this.base(P.floor) - cy; if (Math.floor(t / 300) % 2) { rect(mx - 3, my - 2, 7, 1, '#f2c94c'); rect(mx - 1, my - 3, 3, 1, '#f2c94c'); } }
    if (!tk.done || (tk.leaving && tk.leaving < 1400)) {
      if (tk.leaving) tk.leaving += dt;
      const x = tk.x + (tk.leaving ? tk.leaving * .05 : 0);
      if (!tk.leaving || tk.leaving < 1400) sprite(personSprite(tk.look, tk.leaving ? ['walk0', 'walk1', 'walk2', 'walk3'][Math.floor(tk.leaving / 120) % 4] : ['idle0', 'idle1'][Math.floor(t / 600) % 2]), x - 9, this.base(tk.floor) - PH - cy, !tk.leaving && h.x < x);
    }
    // помощница
    if (this.helper.state === 'shown') {
      const hb = this.base(this.helper.floor) - cy;
      sprite(personSprite(this.helper.look, ['idle0', 'idle1'][Math.floor(t / 500) % 2]), this.helper.x - 9, hb - PH, h.x < this.helper.x);
      if (Math.floor(t / 400) % 2) text('!', this.helper.x, hb - PH - 12, { col: '#f2c94c', align: 'center', shadow: '#0b0c10' });
    }
    // герой
    let fr = 'idle' + (Math.floor(t / 500) % 2);
    if (h.knockT > 0) { h.knockT -= dt; fr = Math.floor(h.knockT / 120) % 2 ? 'knock' : 'idle0'; }
    else if (h.climb) fr = 'climb' + (Math.floor(h.walkT / 260) % 4);
    else if (h.moving) fr = 'walk' + (Math.floor(h.walkT / 130) % 4);
    sprite(personSprite(Object.assign({ blink: Math.floor(t / 2600) % 3 === 0 }, SAVE.look), fr), h.x - 9, h.y - PH - cy, h.dir < 0);
    // подсказка над дверью
    if (!this.busy && !DLG.open && !h.climb) {
      const door = this.nearDoor(), npc = this.nearNPC();
      if (door || npc) { const px = npc ? this.helper.x : DOOR_X[(door - 1) % 4]; const s = isTouch ? '▼' : 'E';
        if (Math.floor(t / 400) % 2) text(s, px, h.y - cy - 86, { col: '#f2c94c', align: 'center', shadow: '#0b0c10' }); }
      if (h.x < STAIR_X + 8) text((h.floor < T.floors ? '▲' : '') + (h.floor > 1 ? '▼' : ''), STAIR_X - 20, h.y - cy - 56, { col: '#f2c94c', align: 'center', shadow: '#0b0c10' });
    }
    drawPops(dt, 0, cy);
    // енот с рассылкой
    if (this.racAnim) {
      const k = this.racAnim.t / 1800, rx = lerp(W + 20, -30, k), ry = 40 + Math.sin(k * Math.PI) * 30;
      sprite(RACCOON, rx, ry);
      for (let i = 0; i < 8; i++) { const pk = clamp(k * 1.6 - i * .08, 0, 1); if (pk <= 0 || pk >= 1) continue; sprite(PLANE, rx + 10 + pk * 140 * Math.cos(i), ry + pk * 160 * Math.sin(i * .7 + .4)); }
    }
    if (this.stampT > 0) { this.stampT -= dt; const s = 1 + Math.max(0, (this.stampT - 600) / 300) * 1.5; ctx.save(); ctx.globalAlpha = Math.min(1, this.stampT / 300);
      ctx.translate(W / 2, 92); ctx.rotate(-.18); ctx.scale(s, s); rect(-34, -12, 68, 24, 'rgba(76,175,110,.25)'); ctx.strokeStyle = '#4caf6e'; ctx.lineWidth = 2; ctx.strokeRect(-34, -12, 68, 24);
      text(LANG === 'kz' ? 'ҚОЛ ҚОЙДЫ' : 'ПОДПИСАНО', 0, -4, { col: '#4caf6e', align: 'center' }); ctx.restore(); }
    this.drawHUD();
    dlgDraw();
    if (this.ballot) this.drawBallot();
    // нажатие по подъезду: герой сам идёт к двери / на нужный этаж
    if (!this.busy && !DLG.open && !this.ballot && !this.over) { const c = clicks.find(c => c.y > 24); if (c) { clicks.splice(clicks.indexOf(c), 1); this.onTap(c.x, c.y + cy); } }
  },
  drawHUD() {
    const T = this.tour;
    rect(0, 0, W, 19, '#0e111c'); rect(0, 19, W, 1, '#55607c'); rect(0, 20, W, 1, 'rgba(5,6,10,.6)');
    rect(126, 3, 1, 13, '#2c3346'); rect(238, 3, 1, 13, '#2c3346');
    const m = Math.floor(this.minute), hh = Math.floor(m / 60), mm = m % 60;
    const left = this.end - this.minute;
    // часы
    rect(6, 4, 9, 9, '#f4f3ee'); rect(7, 5, 7, 7, '#2b2a33'); rect(10, 6, 1, 3, '#f4f3ee'); rect(10, 8, 2, 1, '#f4f3ee');
    text(`${hh}:${String(mm).padStart(2, '0')}`, 19, 5, { col: left < 8 ? '#e98f6f' : '#f4f3ee' });
    rect(64, 6, 60, 6, '#2b2a33'); rect(64, 6, Math.round(60 * clamp(left / T.duration, 0, 1)), 6, left < 8 ? '#e98f6f' : '#7fc4a8');
    // подписи
    const n = this.signatures();
    text(`${L(UI.signs)} ${n}/${T.goal}`, 132, 5, { col: n >= T.goal ? '#4caf6e' : '#f2c94c' });
    if (button(L(UI.ballot), 0, 1, 'dark', { left: 244 }) && !this.busy && !DLG.open) this.ballot = !this.ballot;
    if (button(`${L(UI.raccoon)}×${this.raccoon}`, 0, 1, this.raccoon ? 'alt' : 'off', { left: 330 })) this.useRaccoon();
    text(`${this.hero.floor}${L(UI.floor)}`, 8, 22, { col: '#f4f3ee', shadow: '#0b0c10', size: 6 });
    if (n >= T.goal && !this.busy && !DLG.open) { if (button(L(UI.finish), W / 2, 22, 'primary')) this.finish(false); }
  },
  drawBallot() {
    const T = this.tour;
    rect(0, 0, W, H, 'rgba(11,12,16,.55)');
    paper(40, 22, 320, 192, 8);
    text(L(UI.ballotTitle), W / 2, 30, { align: 'center', col: INK_RED });
    for (let f = T.floors; f >= 1; f--) {
      const y = 46 + (T.floors - f) * 24;
      text(`${f}`, 54, y + 6, { col: INK_MUTED });
      for (let d = 0; d < 4; d++) {
        const apt = (f - 1) * 4 + d + 1, x = 68 + d * 70, r = this.res[apt];
        rect(x, y, 64, 20, '#e2d9c2'); rect(x, y + 19, 64, 1, '#cfc3a5');
        text(String(apt), x + 3, y + 7, { col: INK, size: 6 });
        const st = apt === T.heroApt ? 'me' : r.status;
        if (ICONS[st]) sprite(ICONS[st], x + 17, y + 5);
        const nm = apt === T.heroApt ? L(UI.st.me) : (r.status === 'unknown' ? '' : r.name.split(' ')[0]);
        text(nm.length > 6 ? nm.slice(0, 5) + '.' : nm, x + 28, y + 7, { col: INK_MUTED, size: 6 });
      }
    }
    const cnt = s => Object.values(this.res).filter(r => r.status === s).length;
    const leg = [['yes', cnt('yes')], ['online', cnt('online')], ['thinking', cnt('thinking')], ['no', cnt('no')], ['away', cnt('away')], ['noanswer', cnt('noanswer')]];
    leg.forEach(([k, v], i) => { const x = 62 + i * 46; sprite(ICONS[k], x, 170); text(String(v), x + 12, 171, { col: INK }); });
    if (button(L(UI.close), W / 2, 188, 'alt')) this.ballot = false;
  },
};
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function tweenDoor(r, to) { return new Promise(res => { const from = r.door, t0 = performance.now(); (function step() { const k = Math.min(1, (performance.now() - t0) / 260); r.door = lerp(from, to, k); if (k < 1) requestAnimationFrame(step); else res(); })(); }); }

/* ============================================================
   СЦЕНА: итог тура (протокол)
   ============================================================ */
scenes.result = {
  enter(d) { this.d = d; this.t = 0; setTouch({ act: L(UI.next) }); if (d.success) setTimeout(() => sfx.stamp(), 500);
    this.rank = null; if (!d.offline) API.leaderboard('complex').then(r => this.rank = r.mine).catch(() => {}); },
  update(dt) { this.t += dt; if (hit('act')) irisTo(W / 2, 200, () => go('title')); },
  draw(dt) {
    const d = this.d;
    drawNight(dt);
    paper(56, 10, 288, 210, 11);
    text(L(UI.protocol), W / 2, 18, { align: 'center', col: INK_MUTED });
    text(d.success ? L(UI.win) : L(UI.lose), W / 2, 32, { align: 'center', col: d.success ? INK_TEAL : INK_RED });
    const rows = [[L(UI.rSigned), `${d.signatures}/${TOURS.t1.goal}`], ['  ' + L(UI.rOnline), String(d.online)], [L(UI.rAgainst), String(d.against)], [L(UI.rThinking), String(d.thinking)]];
    if (!d.offline) rows.push([L(UI.rScore), String(d.score) + (d.newBest ? ' ★' : '')], [L(UI.rRank), this.rank ? '#' + this.rank.rank : '…'], [L(UI.rCoins), '+' + d.coins]);
    rows.forEach(([a, b], i) => { text(a, 74, 48 + i * 13, { col: INK }); text(b, 326, 48 + i * 13, { col: i === 4 && d.newBest ? INK_GOLD : INK, align: 'right' }); rect(74, 57 + i * 13, 252, 1, '#e2d9c2'); });
    // бонус в приложение
    let note, col = INK_MUTED;
    if (d.offline) note = L(UI.rOffline);
    else if (d.reward && d.reward.status === 'sent') { note = L(UI.rRewardSent).replace('{n}', d.reward.points); col = INK_TEAL; }
    else if (d.reward && d.reward.status === 'needs_login') { note = L(UI.rRewardGuest).replace('{n}', d.reward.points); col = INK_GOLD; }
    else note = d.success ? L(UI.rNext) : L(UI.rRetry);
    wrapText(note, 200).slice(0, 3).forEach((l, i) => text(l, 172, 140 + i * 10, { align: 'center', col, size: 6 }));
    if (d.success && this.t > 500) { const k = Math.min(1, (this.t - 500) / 200), s = 1 + (1 - k) * 1.5; ctx.save(); ctx.translate(296, 154); ctx.rotate(-.25); ctx.scale(s, s); ctx.globalAlpha = k;
      ctx.strokeStyle = '#b8443f'; ctx.lineWidth = 2; ctx.strokeRect(-30, -10, 60, 20); text('ОСИ', 0, -4, { col: '#b8443f', align: 'center' }); ctx.restore(); }
    const bw = 84;
    if (button(L(UI.menu), 108, 186, 'alt', { w: bw })) irisTo(108, 194, () => go('title'));
    if (button(L(UI.rating), 200, 186, 'alt', { w: bw })) irisTo(200, 194, () => go('leaderboard', { from: 'result' }));
    if (button(L(UI.again), 292, 186, 'primary', { w: bw })) irisTo(292, 194, () => go('tour', { tour: 't1' }));
  },
};

/* ============================================================
   СЦЕНА: рейтинг — соседи по ЖК и весь город
   ============================================================ */
scenes.leaderboard = {
  enter(d) { this.from = d && d.from; this.scope = USER.guest ? 'city' : 'complex'; this.fetch(); setTouch({ act: L(UI.back) }); },
  fetch() {
    this.data = null; this.err = false; const scope = this.scope;
    API.leaderboard(scope).then(r => { if (this.scope === scope) this.data = r; }).catch(() => { this.err = true; });
  },
  update() { if (hit('act') || hit('back')) irisTo(W / 2, 200, () => go('title')); if (hit('left') || hit('right')) { this.scope = this.scope === 'city' ? 'complex' : 'city'; this.fetch(); } },
  draw(dt) {
    drawNight(dt);
    frameBox(60, 10, 280, 206);
    text(L(UI.rating), W / 2, 20, { align: 'center', col: '#f4f3ee' });
    if (button(L(UI.tabComplex), 150, 34, this.scope === 'complex' ? 'primary' : 'off', { w: 92 }) && this.scope !== 'complex') { this.scope = 'complex'; this.fetch(); }
    if (button(L(UI.tabCity), 250, 34, this.scope === 'city' ? 'primary' : 'off', { w: 92 }) && this.scope !== 'city') { this.scope = 'city'; this.fetch(); }
    const D = this.data;
    if (this.err) { text(L(UI.netFail), W / 2, 100, { align: 'center', col: '#e88a7a', size: 6 }); if (button(L(UI.retry), W / 2, 116, 'alt')) this.fetch(); }
    else if (!D) text('…', W / 2, 100, { align: 'center', col: '#8792ad' });
    else {
      if (USER.guest) wrapText(L(UI.guestNote), 260, 6).slice(0, 2).forEach((l, i) => text(l, W / 2, 53 + i * 7, { align: 'center', col: '#8792ad', size: 6 }));
      else if (this.scope === 'complex' && D.complexName) text(D.complexName, W / 2, 56, { align: 'center', col: '#9fd9c2', size: 6 });
      const row = (r, y) => {
        if (r.me) rect(72, y - 3, 256, 13, 'rgba(242,201,76,.18)');
        const c = r.me ? '#f2c94c' : r.rank <= 3 ? '#f4f3ee' : '#cfd6e4';
        text(String(r.rank), 84, y, { col: r.rank <= 3 ? ['#f2c94c', '#cfd6e4', '#d39a6a'][r.rank - 1] : '#8792ad', align: 'center' });
        text(r.me ? r.name + ' (' + L(UI.you) + ')' : r.name, 100, y, { col: c });
        text(String(r.best), 320, y, { col: c, align: 'right' });
      };
      const meIn = D.top.some(r => r.me), top = D.mine && !meIn ? D.top.slice(0, 7) : D.top;
      top.forEach((r, i) => row(r, 68 + i * 14));
      if (D.mine && !meIn) { text('···', W / 2, 68 + top.length * 14 - 3, { align: 'center', col: '#55607c' }); row(D.mine, 68 + top.length * 14 + 6); }
      if (!D.mine) text(L(UI.noScore), W / 2, 186, { align: 'center', col: '#8792ad', size: 6 });
    }
    if (button(L(UI.back), W / 2, 196, 'alt')) irisTo(W / 2, 204, () => go(this.from === 'result' ? 'title' : 'title'));
  },
};

/* ============================================================
   ЗАПУСК
   ============================================================ */
(async function boot() {
  try { if (document.fonts) await Promise.race([document.fonts.load('8px "Press Start 2P"', 'ҮЙ №67 ӘҒҚҢӨҰҮҺІ әғқңөұүһі'), wait(2500)]); } catch (e) {}
  // вход через сервер (пока — заглушка). Если связи нет, пробуем снова
  for (let i = 0; ; i++) {
    try { USER = await API.auth(); SAVE = (await API.load()) || (await migrateOldSave()) || NEW_SAVE(); break; }
    catch (e) { const m = document.getElementById('err'); m.textContent = 'E-KNOT: байланыс жоқ / нет связи… (' + (i + 1) + ')'; m.hidden = false; await wait(1500); }
  }
  document.getElementById('err').hidden = true; document.getElementById('err').textContent = '';
  SAVE.tours = SAVE.tours || {}; SAVE.trust = SAVE.trust || {};
  SAVE.look = { ...DEFAULT_LOOK, ...(SAVE.look || {}) };   // неполное сохранение не должно ломать отрисовку героя
  if (USER.name && !SAVE.name) SAVE.name = USER.name;
  document.getElementById('rotate').textContent = L(UI.rotate);
  go('title');
  requestAnimationFrame(frame);
})();

</script>
